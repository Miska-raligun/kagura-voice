name: server

# 新服务端（server/，TypeScript）的 CI：
#   unit     ：类型检查 + vitest 单测 + M0 验证脚本（Node 22 / 24）
#   contract ：打出真正的单文件可执行，在 Windows / Linux / macOS 上跑全部契约用例
#              （contract-tests/，与 Python 版同一套）
on:
  push:
    branches: [feat/kagura-agent-server]
    paths: ["server/**", "contract-tests/**", "web/**", "device/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "contract-tests/**", "web/**", "device/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  unit:
    name: unit / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx tsc --noEmit -p admin-ui          # 管理界面（Preact）
      - run: npx vitest run
      - name: M0 验证脚本
        run: |
          for f in spikes/pi-agent.ts spikes/pi-openai-compat.ts spikes/infra.ts spikes/fts-cjk.ts; do
            node --experimental-strip-types --no-warnings "$f"
          done

  contract:
    name: contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"            # 发布产物用 Node 24 LTS（node:sqlite 已转正）
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build 单文件可执行
        working-directory: server
        shell: bash
        run: |
          npm ci
          node scripts/build.mjs src/main.ts dist/kagura.cjs
          node scripts/sea.mjs dist/kagura.cjs dist/kagura
          ls -la dist
      - name: 托盘版冒烟（Windows：图形界面子系统，不开控制台也能起服务、写日志、退出）
        if: runner.os == 'Windows'
        working-directory: server
        shell: pwsh
        run: |
          node scripts/gui-exe.mjs dist/kagura.exe dist/kagura-tray.exe
          $data = Join-Path $env:RUNNER_TEMP "kagura-tray-smoke"
          $env:KAGURA_DATA_DIR = $data; $env:KAGURA_PORT = "5390"; $env:KAGURA_MQTT_PORT = "11390"; $env:KAGURA_STREAM_PORT = "15390"
          $env:KAGURA_DISC_PORT = "15391"; $env:KAGURA_FAKE_PROVIDERS = "1"; $env:KAGURA_NO_TRAY = "1"
          $p = Start-Process (Resolve-Path dist\kagura-tray.exe) -ArgumentList '--tray','--no-browser' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 1; try { $h = Invoke-RestMethod http://127.0.0.1:5390/health -TimeoutSec 2; if ($h.app -eq 'kagura') { $ok = $true; break } } catch {} }
          if (-not $ok) { Get-Content "$data\logs\kagura.log" -ErrorAction SilentlyContinue; throw "托盘版没起来" }
          if (-not (Select-String -Path "$data\logs\kagura.log" -Pattern "管理界面" -Quiet)) { throw "托盘版没写日志" }
          Invoke-RestMethod -Method Post http://127.0.0.1:5390/api/admin/quit -TimeoutSec 5 | Out-Null
          Start-Sleep 3
          if (-not $p.HasExited) { Stop-Process $p -Force; throw "退出命令没生效" }
      - name: Install contract test deps
        run: pip install "paho-mqtt==1.6.1" pytest requests
      - name: Contract tests（对单文件可执行）
        working-directory: contract-tests
        shell: bash
        env:
          KAGURA_SERVER_PROVIDES: broker,discovery
        run: |
          exe=server/dist/kagura; [ -f ../server/dist/kagura.exe ] && exe=server/dist/kagura.exe
          KAGURA_SERVER_CMD="$exe" python -m pytest -q
      - name: Contract tests（内置 agent，KAGURA_BRAIN=pi）
        working-directory: contract-tests
        shell: bash
        env:
          KAGURA_SERVER_PROVIDES: broker,discovery
          KAGURA_BRAIN: pi
        run: |
          exe=server/dist/kagura; [ -f ../server/dist/kagura.exe ] && exe=server/dist/kagura.exe
          KAGURA_SERVER_CMD="$exe" python -m pytest -q
      - name: Server logs on failure
        if: failure()
        shell: bash
        run: |
          for f in $(python -c "import tempfile,glob,os;print(' '.join(glob.glob(os.path.join(tempfile.gettempdir(),'kagura-contract-*','server.log'))))"); do
            echo "== $f"; tail -60 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kagura-${{ matrix.os }}
          path: server/dist/kagura*
          retention-days: 7
