name: release

# 打安装包并发布（§9）。本期只发 Windows + Linux（没有 Apple 开发者账号，macOS 只在 server.yml 里编译测试）。
# 两种发布方式（都会先构建 → 在 CI 上装上安装包跑完整契约测试 → 通过才发布）：
#   - 推 v* tag
#   - 改 server/packaging/release-version.txt 并推到分支：由本工作流在该提交上创建 v<版本> tag 并发布
#     （给不能直接推 tag 的环境用，例如只允许推分支的自动化会话）
# 其它情况（改了打包相关文件 / 手动触发）只构建和验证，产物在 Actions artifact 里。
# 产物：Kagura-Setup-<版本>.exe、Kagura-<版本>-x86_64.AppImage、kagura_<版本>_amd64.deb、kagura-device-<版本>.zip、SHA256SUMS
on:
  push:
    tags: ["v*"]
    branches: [feat/kagura-agent-server, main]
    paths: ["server/packaging/**", "server/scripts/**", "tools/pack_device.py", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 版本号与是否发布
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT; echo "publish=true" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && git diff --name-only HEAD^ HEAD | grep -qx server/packaging/release-version.txt; then
            ver=$(tr -d ' \r\n' < server/packaging/release-version.txt)
            if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
              echo "v$ver 已经发布过，只构建不发布"; echo "ver=$ver" >> $GITHUB_OUTPUT; echo "publish=false" >> $GITHUB_OUTPUT
            else
              echo "ver=$ver" >> $GITHUB_OUTPUT; echo "publish=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "ver=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT; echo "publish=false" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

  linux:
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.1", cache: npm, cache-dependency-path: server/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 构建单文件可执行
        working-directory: server
        env: { KAGURA_VERSION: "${{ needs.meta.outputs.ver }}" }
        run: |
          npm ci
          node scripts/build.mjs src/main.ts dist/kagura.cjs
          node scripts/sea.mjs dist/kagura.cjs dist/kagura
          node scripts/make-icon.mjs
          test "$(./dist/kagura --version)" = "$KAGURA_VERSION"
      - name: 打 deb 与 AppImage
        working-directory: server
        run: bash packaging/linux/build.sh "${{ needs.meta.outputs.ver }}"
      - name: 打固件包
        run: python tools/pack_device.py "${{ needs.meta.outputs.ver }}" server/dist
      - name: 装上 deb，对安装好的程序跑契约测试（OpenClaw 模式 + 内置 agent 模式）
        run: |
          sudo dpkg -i server/dist/kagura_*_amd64.deb
          test -L /usr/bin/kagura && test -f /usr/lib/systemd/user/kagura.service
          pip install "paho-mqtt==1.6.1" pytest requests
          cd contract-tests
          KAGURA_SERVER_CMD=/usr/bin/kagura KAGURA_SERVER_PROVIDES=broker,discovery python -m pytest -q
          KAGURA_BRAIN=pi KAGURA_SERVER_CMD=/usr/bin/kagura KAGURA_SERVER_PROVIDES=broker,discovery python -m pytest -q
          sudo dpkg -r kagura
          test ! -e /usr/bin/kagura
      - name: AppImage 冒烟
        env: { APPIMAGE_EXTRACT_AND_RUN: "1" }
        run: |
          app=$(ls $PWD/server/dist/Kagura-*-x86_64.AppImage)
          "$app" --version
          cd contract-tests
          KAGURA_SERVER_CMD="$app" KAGURA_SERVER_PROVIDES=broker,discovery python -m pytest -q test_00_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            server/dist/*.deb
            server/dist/*.AppImage
            server/dist/kagura-device-*.zip
          retention-days: 14

  windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.1", cache: npm, cache-dependency-path: server/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 构建单文件可执行
        working-directory: server
        env: { KAGURA_VERSION: "${{ needs.meta.outputs.ver }}" }
        run: |
          npm ci
          node scripts/build.mjs src/main.ts dist/kagura.cjs
          node scripts/sea.mjs dist/kagura.cjs dist/kagura
          node scripts/gui-exe.mjs dist/kagura.exe dist/kagura-tray.exe
          node scripts/make-icon.mjs
          test "$(./dist/kagura.exe --version | tr -d '\r')" = "$KAGURA_VERSION"
      - name: 打安装包（Inno Setup）
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.ver }}" server\packaging\windows\kagura.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem server\dist\Kagura-Setup-*.exe
      - name: 静默安装，检查防火墙规则与快捷方式
        shell: pwsh
        run: |
          $setup = (Get-ChildItem server\dist\Kagura-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="firewall"' -Wait
          if (-not (Test-Path "$env:ProgramFiles\Kagura\kagura.exe")) { throw "没装上" }
          netsh advfirewall firewall show rule name=Kagura
          if ($LASTEXITCODE -ne 0) { throw "防火墙规则没加上" }
          & "$env:ProgramFiles\Kagura\kagura.exe" --version
      - name: 托盘版冒烟：不开控制台也能起服务、写日志、正常退出
        shell: pwsh
        run: |
          $tray = "$env:ProgramFiles\Kagura\kagura-tray.exe"
          if (-not (Test-Path $tray)) { throw "没装上 kagura-tray.exe" }
          $data = Join-Path $env:RUNNER_TEMP "kagura-tray-smoke"
          $env:KAGURA_DATA_DIR = $data; $env:KAGURA_PORT = "5390"; $env:KAGURA_MQTT_PORT = "11390"; $env:KAGURA_STREAM_PORT = "15390"
          $env:KAGURA_DISC_PORT = "15391"; $env:KAGURA_FAKE_PROVIDERS = "1"; $env:KAGURA_NO_TRAY = "1"
          $p = Start-Process $tray -ArgumentList '--tray','--no-browser' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 1; try { $h = Invoke-RestMethod http://127.0.0.1:5390/health -TimeoutSec 2; if ($h.app -eq 'kagura') { $ok = $true; break } } catch {} }
          if (-not $ok) { Get-Content "$data\logs\kagura.log" -ErrorAction SilentlyContinue; throw "托盘版没起来" }
          if (-not (Select-String -Path "$data\logs\kagura.log" -Pattern "管理界面" -Quiet)) { throw "托盘版没写日志" }
          Invoke-RestMethod -Method Post http://127.0.0.1:5390/api/admin/quit -TimeoutSec 5 | Out-Null
          Start-Sleep 3
          if (-not $p.HasExited) { Stop-Process $p -Force; throw "退出命令没生效" }
      - name: 对安装好的程序跑契约测试（OpenClaw 模式 + 内置 agent 模式）
        run: |
          pip install "paho-mqtt==1.6.1" pytest requests
          cd contract-tests
          exe='"C:/Program Files/Kagura/kagura.exe"'
          KAGURA_SERVER_CMD="$exe" KAGURA_SERVER_PROVIDES=broker,discovery python -m pytest -q
          KAGURA_BRAIN=pi KAGURA_SERVER_CMD="$exe" KAGURA_SERVER_PROVIDES=broker,discovery python -m pytest -q
      - name: 在线更新冒烟：运行中的托盘版下载安装包、静默重装、自己重新拉起
        shell: pwsh
        run: |
          # 本地假发布源：「新版本」就是刚打好的这个安装包，digest 按 GitHub 的格式给
          $feed = Join-Path $env:RUNNER_TEMP "feed"; New-Item -ItemType Directory -Force $feed | Out-Null
          Copy-Item (Get-ChildItem server\dist\Kagura-Setup-*.exe).FullName "$feed\Kagura-Setup-99.0.0.exe"
          $f = Get-Item "$feed\Kagura-Setup-99.0.0.exe"
          $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          $rel = @(@{ tag_name = "v99.0.0"; draft = $false; html_url = ""; body = "smoke"; published_at = ""
            assets = @(@{ name = $f.Name; size = $f.Length; digest = "sha256:$sha"; browser_download_url = "http://127.0.0.1:8765/$($f.Name)" }) })
          ConvertTo-Json -InputObject $rel -Depth 5 | Set-Content -Encoding utf8 "$feed\releases.json"
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$feed -PassThru -WindowStyle Hidden

          $data = Join-Path $env:RUNNER_TEMP "kagura-update-smoke"
          $env:KAGURA_DATA_DIR = $data; $env:KAGURA_PORT = "5391"; $env:KAGURA_MQTT_PORT = "11391"; $env:KAGURA_STREAM_PORT = "15392"
          $env:KAGURA_DISC_PORT = "15393"; $env:KAGURA_NO_TRAY = "1"; $env:KAGURA_NO_PROMPT = "1"
          $env:KAGURA_RELEASES_API = "http://127.0.0.1:8765/releases.json"
          $base = "http://127.0.0.1:5391"
          function Up { try { (Invoke-RestMethod "$base/health" -TimeoutSec 2).app -eq 'kagura' } catch { $false } }
          function ListenPid { (Get-NetTCPConnection -LocalPort 5391 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).OwningProcess }
          function Dump { Write-Host "--- update.log"; Get-Content "$data\updates\update.log" -ErrorAction SilentlyContinue
            Write-Host "--- updates/"; Get-ChildItem "$data\updates" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
            Write-Host "--- state"; try { Invoke-RestMethod "$base/api/admin/update" -TimeoutSec 3 | ConvertTo-Json -Depth 5 } catch { Write-Host "（服务端没响应）" }
            Write-Host "--- processes"; Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'kagura|powershell|Kagura-Setup' } | Format-Table ProcessId, ParentProcessId, Name, CommandLine -Wrap | Out-String -Width 300 | Write-Host
            Write-Host "--- kagura.log"; Get-Content "$data\logs\kagura.log" -Tail 60 -ErrorAction SilentlyContinue }

          Start-Process "$env:ProgramFiles\Kagura\kagura-tray.exe" -ArgumentList '--tray','--no-browser' | Out-Null
          for ($i = 0; $i -lt 30 -and -not (Up); $i++) { Start-Sleep 1 }
          if (-not (Up)) { Dump; throw "托盘版没起来" }
          $pid0 = ListenPid
          Invoke-RestMethod -Method Post "$base/api/admin/update/check" -ContentType 'application/json' -Body '{}' | Out-Null
          $u = Invoke-RestMethod "$base/api/admin/update"
          if (-not $u.info.newer) { $u | ConvertTo-Json -Depth 5; Dump; throw "没查到假发布源里的新版本" }
          Invoke-RestMethod -Method Post "$base/api/admin/update/install" -ContentType 'application/json' -Body '{}' | Out-Null

          $ok = $false
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep 1
            $log = Get-Content "$data\updates\update.log" -Raw -ErrorAction SilentlyContinue
            if ($log -match 'relaunched' -and (Up) -and (ListenPid) -ne $pid0) { $ok = $true; break }
            if ($log -match 'uac-declined|server still running') { break }
          }
          Dump
          if (-not $ok) { throw "在线更新后服务没有被重新拉起" }
          if ($log -notmatch 'installer exit 0') { throw "安装程序没有正常退出" }
          Invoke-RestMethod -Method Post "$base/api/admin/quit" -TimeoutSec 5 | Out-Null
          Stop-Process $srv -Force -ErrorAction SilentlyContinue
      - name: 静默卸载，规则一并删掉
        shell: pwsh
        run: |
          Start-Process "$env:ProgramFiles\Kagura\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 3
          if (Test-Path "$env:ProgramFiles\Kagura\kagura.exe") { throw "卸载后程序还在" }
          netsh advfirewall firewall show rule name=Kagura
          if ($LASTEXITCODE -eq 0) { throw "卸载后防火墙规则还在" }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: server/dist/Kagura-Setup-*.exe
          retention-days: 14

  publish:
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 校验和
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # tag 不存在时（release-version.txt 方式）在本次提交上创建
          tag_name: v${{ needs.meta.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: Kagura ${{ needs.meta.outputs.ver }}
          files: out/*
          body_path: server/packaging/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.meta.outputs.ver, '-') }}
