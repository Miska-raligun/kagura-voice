<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kagura">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon.svg">
<link rel="apple-touch-icon" href="/app/icon.svg">
<title>Kagura</title>
<!--
  手机 / 平板客户端（服务端 /app，单文件、无外部依赖）。手机是一台和 CoreS3 并列的设备：
  用手机自己的麦克风、喇叭、摄像头跟她对话（/chat、/chat-vision、异步长轮询，协议同设备）；
  「看家」页用监控接口远程看 CoreS3（直播、拍照）。配对令牌存 localStorage，推送走 SSE（/client/events）。
  浏览器只在 HTTPS（或 localhost）下给麦克风 / 摄像头——局域网 http 地址打开时按住说话会被拦，见 README。
-->
<style>
:root {
  --bg:#111113; --panel:#1b1b1e; --panel2:#242428; --fg:#f5f5f7; --muted:rgba(245,245,247,.7); --faint:rgba(245,245,247,.42);
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18); --accent:#f2f2f4; --accent-fg:#16161a; --ok:#5fd4a0; --err:#ff7a6b;
  --glass:rgba(0,0,0,.28); --glass2:rgba(0,0,0,.34);
  --stage-h:min(75vw, 44vh);       /* 角色图按 4:3 完整露出来的高度 */
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
body { font:15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
input, select { font:inherit; color:var(--fg); outline:none; min-width:0; }
svg { display:block; }
.hidden { display:none !important; }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; }
.dot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); } .dot.off { background:var(--err); }

/* ── 整体：角色图铺满做背景，聊天浮在上面 ── */
.app { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
/* 底色 = 同一张图放大糊开压暗（颜色跟着角色走）；清晰的那张按 4:3 放在上面，聊天从它下面开始，不压着她 */
.backdrop { position:absolute; inset:0; overflow:hidden; background:var(--bg); }
.backdrop .ambient { position:absolute; inset:-12%; width:124%; height:124%; object-fit:cover; filter:blur(36px) saturate(1.15) brightness(.42); transform:translateZ(0); }
.backdrop #bg { position:absolute; left:0; right:0; top:0; width:100%; height:var(--stage-h); object-fit:cover;
  -webkit-mask-image:linear-gradient(180deg, #000 80%, transparent 100%); mask-image:linear-gradient(180deg, #000 80%, transparent 100%); }
.backdrop .face { position:absolute; left:0; right:0; top:calc(var(--stage-h) * .45); text-align:center; font-size:42px; color:var(--accent); opacity:.85; letter-spacing:.04em; }
.backdrop .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.38) 0, transparent calc(var(--safe-t) + 70px)); }

header { position:relative; z-index:2; display:flex; align-items:center; gap:10px; padding:calc(var(--safe-t) + 8px) 12px 8px 14px; }
.who { position:relative; display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.avatar { width:38px; height:38px; border-radius:50%; overflow:hidden; flex:none; background:var(--panel2); border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--accent); }
.avatar img { width:100%; height:100%; object-fit:cover; }
.who-text { display:flex; flex-direction:column; min-width:0; line-height:1.25; text-shadow:0 1px 6px #0009; }
.who-name { font-weight:600; font-size:16px; display:flex; align-items:center; gap:4px; }
.who-name svg { width:14px; height:14px; opacity:.7; }
.who-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.who select { position:absolute; inset:0; opacity:0; width:100%; cursor:pointer; }
.hbtn { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); flex:none; }
.hbtn svg { width:20px; height:20px; }

.notice { position:relative; z-index:2; margin:0 12px 6px; padding:8px 10px 8px 12px; border-radius:12px; background:var(--glass2); border:1px solid var(--line);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:12.5px; color:var(--muted); display:flex; gap:8px; align-items:flex-start; }
.notice button { color:var(--faint); font-size:18px; line-height:1; padding:0 2px; }

main { position:relative; z-index:1; flex:1; min-height:0; }
.page { position:absolute; inset:0; display:flex; flex-direction:column; }

/* ── 对话 ── */
.stagegap { flex:none; height:max(0px, calc(var(--stage-h) - var(--safe-t) - 78px)); }
.log { flex:1; overflow-y:auto; padding:22px 12px 8px;
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 22px); mask-image:linear-gradient(180deg, transparent 0, #000 22px); display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.log::before { content:""; margin-top:auto; }       /* 消息从底部往上排 */
.msg { max-width:78%; padding:8px 12px; border-radius:18px; white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.45; }
/* 两边都是半透明：我的偏亮一点，她的偏暗一点，不抢角色图的颜色 */
.msg.me { align-self:flex-end; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.16); border-bottom-right-radius:6px; }
.msg.her { align-self:flex-start; background:rgba(0,0,0,.26); border:1px solid rgba(255,255,255,.08); border-bottom-left-radius:6px; }
.msg.sys { align-self:center; max-width:88%; background:rgba(0,0,0,.25); color:var(--muted); font-size:12px; padding:3px 10px; border-radius:10px; text-align:center; }
.msg img { display:block; max-width:200px; max-height:220px; border-radius:12px; margin:-2px -6px 6px; }
.msg .act { display:inline-block; margin-top:6px; color:var(--accent); font-weight:600; }

.status { align-self:center; margin:0 0 8px; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 12px; border-radius:20px;
  background:var(--glass2); border:1px solid var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font-size:13px; }
.status .stop { padding:3px 10px; border-radius:14px; background:#ffffff14; font-size:12.5px; }
.bars { display:inline-flex; gap:2.5px; align-items:center; height:14px; }
.bars i { width:2.5px; background:var(--accent); border-radius:2px; height:4px; transition:height .08s; }
.bars.idle i { animation:breathe 1.2s ease-in-out infinite; }
.bars.idle i:nth-child(2) { animation-delay:.15s } .bars.idle i:nth-child(3) { animation-delay:.3s } .bars.idle i:nth-child(4) { animation-delay:.45s } .bars.idle i:nth-child(5) { animation-delay:.6s }
@keyframes breathe { 0%,100% { height:4px } 50% { height:12px } }

.composer { flex:none; padding:8px 10px calc(var(--safe-b) + 8px); }
.attach { display:flex; align-items:center; gap:10px; margin:0 4px 8px; padding:6px; border-radius:14px; background:var(--glass2); border:1px solid var(--line); font-size:13px; color:var(--muted); }
.attach img { width:40px; height:40px; object-fit:cover; border-radius:9px; }
.attach span { flex:1; }
.attach button { width:28px; height:28px; border-radius:50%; background:#ffffff14; font-size:16px; }
.cbar { display:flex; align-items:center; gap:6px; padding:5px; border-radius:26px; background:rgba(255,255,255,.09); border:1px solid var(--line2);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.cbtn { width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.cbtn svg { width:22px; height:22px; }
.cbtn.send { background:var(--accent); color:var(--accent-fg); }
.cbar input { flex:1; height:40px; padding:0 6px; background:none; border:0; font-size:16px; }   /* 16px：iOS 不会自动放大页面 */
.cbar input::placeholder { color:var(--faint); }
.talk { flex:1; height:40px; border-radius:20px; background:#ffffff0f; font-size:15px; font-weight:600; letter-spacing:.06em;
  display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none;
  transition:background .15s, color .15s, transform .1s; }
.talk.rec { background:var(--accent); color:var(--accent-fg); transform:scale(.98); }
.talk.busy { color:var(--muted); font-weight:500; letter-spacing:0; }

/* ── 看家 ── */
#homePage { background:rgba(17,17,19,.9); }
.home { flex:1; overflow-y:auto; padding:4px 12px calc(var(--safe-b) + 16px); display:flex; flex-direction:column; gap:12px; }
.card { background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:18px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:14px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
.card h3 select { background:var(--panel2); border:1px solid var(--line2); border-radius:14px; padding:3px 10px; font-size:14px; color:var(--fg); font-weight:600; }
.kv { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13.5px; color:var(--muted); }
.kv b { color:var(--fg); font-weight:500; }
.live { position:relative; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.live img { width:100%; height:100%; object-fit:contain; }
.live .hint { position:absolute; color:var(--faint); font-size:13px; text-align:center; padding:0 24px; }
.btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.btn { height:34px; padding:0 14px; border-radius:17px; background:var(--panel2); border:1px solid var(--line2); font-size:13.5px; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600; }
.btn:disabled { opacity:.45; }
.shots { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.shots img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; background:var(--panel2); }
.photo { margin-top:10px; } .photo img { width:100%; border-radius:12px; }

/* ── 配对 ── */
.pair { flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px; gap:14px; }
.pair h1 { margin:0; font-size:26px; } .pair ol { margin:0; padding-left:20px; color:var(--muted); line-height:1.9; }
.pair .row { display:flex; gap:8px; }
.pair input { flex:1; height:42px; padding:0 12px; border-radius:12px; background:var(--panel2); border:1px solid var(--line2); }
.pair .btn { height:42px; }

.toast { position:fixed; left:50%; bottom:calc(var(--safe-b) + 84px); transform:translateX(-50%); background:var(--glass2); border:1px solid var(--line2);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:8px 14px; border-radius:16px; font-size:13px; max-width:88vw; z-index:9; box-shadow:0 6px 24px #0008; }
.toast.err { border-color:var(--err); }
</style>
</head>
<body>

<div id="pairView" class="pair hidden">
  <h1>Kagura</h1>
  <p class="muted">这台手机还没配对。在电脑上：</p>
  <ol>
    <li>打开 Kagura 管理界面 → <b>设备</b></li>
    <li>点「<b>＋ 添加手机</b>」，用手机相机扫二维码</li>
  </ol>
  <p class="faint" style="font-size:13px">也可以把管理界面给出的配对链接直接粘贴到下面：</p>
  <div class="row"><input id="pairInput" placeholder="https://…/app#pair=kc_…"><button class="btn primary" id="pairBtn">配对</button></div>
</div>

<div id="appView" class="app hidden">
  <div class="backdrop"><img id="bgAmb" class="ambient hidden" alt=""><img id="bg" alt="" class="hidden"><div class="face" id="face">(｡･ω･｡)</div><div class="veil"></div></div>
  <header>
    <label class="who">
      <span class="avatar" id="avatarBox"><img id="avatar" alt="" class="hidden"><span id="avatarText">神</span></span>
      <span class="who-text">
        <span class="who-name"><span id="meName">Kagura</span><svg id="roleChev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg></span>
        <span class="who-sub"><span class="dot" id="conn"></span><span id="connText">连接中…</span></span>
      </span>
      <select id="roleSel" aria-label="换角色"></select>
    </label>
    <button class="hbtn" id="tabHome" aria-label="看家"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><circle cx="12" cy="14.5" r="2.6"/></svg></button>
    <button class="hbtn hidden" id="tabChat" aria-label="回到对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14v10H10l-5 4z"/></svg></button>
  </header>
  <div id="insecure" class="notice hidden"><span>当前不是 https 地址，浏览器不让网页录音：「按住说话」用不了，可以点键盘上的麦克风键语音输入。其它都正常。</span><button id="insecureX" aria-label="知道了">×</button></div>
  <main>
    <section class="page" id="chatPage">
      <div class="stagegap"></div>
      <div class="log" id="log"></div>
      <div class="status hidden" id="status"><span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span><span id="stateText"></span><button class="stop" id="stopBtn">停止</button></div>
      <div class="composer">
        <div class="attach hidden" id="attach"><img id="attachImg" alt=""><span>这张照片会和下一句一起发给她</span><button id="attachX" aria-label="移除">×</button></div>
        <div class="cbar">
          <button class="cbtn" id="modeBtn" aria-label="切换语音 / 键盘"><svg id="icoKbd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M10 10h.01M13 10h.01M16 10h.01M8 14h8"/></svg><svg id="icoMic" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg></button>
          <button class="talk" id="talk"><span id="talkText">按住 说话</span></button>
          <input id="text" class="hidden" placeholder="发消息…" enterkeyhint="send" autocomplete="off">
          <button class="cbtn" id="camBtn" aria-label="拍照"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8.5h3.2L9 6h6l1.8 2.5H20V18H4z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
          <button class="cbtn send hidden" id="sendBtn" aria-label="发送"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 11.2L19 4.5c.6-.3 1.2.3 1 .9l-5 14c-.2.6-1.1.7-1.4.1L11 13l-6.3-.8c-.6-.1-.8-.8-.2-1z"/></svg></button>
        </div>
        <input type="file" accept="image/*" capture="environment" id="camInput" class="hidden">
      </div>
    </section>

    <section class="page hidden" id="homePage">
      <div class="home">
        <div class="card">
          <h3><span class="dot" id="devDot"></span><select id="devSel"></select></h3>
          <div class="kv" id="devKv"><span class="faint">读取中…</span></div>
        </div>
        <div class="card">
          <h3>实时画面</h3>
          <div class="live"><img id="liveImg" alt="" class="hidden"><div class="hint" id="liveHint">点「开始看」，CoreS3 的摄像头会开始推流（离开这页会自动停）</div></div>
          <div class="btns">
            <button class="btn primary" id="liveBtn">开始看</button>
            <button class="btn" id="snapBtn">拍一张</button>
            <button class="btn" id="hiresBtn">拍清晰版</button>
          </div>
          <div class="photo hidden" id="photoBox"><img id="photoImg" alt=""><div class="btns"><button class="btn" id="describeBtn">让她说说看到了什么</button></div></div>
        </div>
        <div class="card">
          <h3>最近的照片</h3>
          <div class="shots" id="shots"><span class="faint" style="font-size:13px">还没有</span></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
// ── 基础 ──
const $ = (id) => document.getElementById(id);
const S = { token: "", me: null, role: "", roles: [], busy: false, replyId: "", player: null, pending: [], photo: null, cancelled: false };
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };

let toastTimer = 0;
function toast(text, err) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = text; t.classList.toggle("err", !!err); t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), err ? 4500 : 2500);
}
const authH = (h = {}) => ({ ...h, Authorization: "Bearer " + S.token });
const devH = (h = {}) => authH({ "X-Device-Id": S.me ? S.me.id : "", ...h });
async function api(path, opts = {}) {
  const headers = authH(opts.headers || {});
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) { unpair("令牌已失效，请重新配对"); throw new Error("未配对"); }
  return r;
}
async function apiJson(path, opts) {
  const r = await api(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
/** 响应头里的 b64 UTF-8 文本（X-User-Text / X-Reply-Text） */
function b64text(v) {
  if (!v) return "";
  try { return new TextDecoder().decode(Uint8Array.from(atob(v), (c) => c.charCodeAt(0))); } catch { return ""; }
}
function localTime() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── 配对 ──
function readPairFromHash() {
  const m = /[#&]pair=(kc_[\w-]+)/.exec(location.hash);
  if (!m) return false;
  store.set("kagura_token", m[1]);
  history.replaceState(null, "", location.pathname);   // 令牌别留在地址栏里
  return true;
}
function unpair(msg) {
  store.set("kagura_token", "");
  S.token = ""; S.me = null;
  if (S.es) S.es.close();
  $("appView").classList.add("hidden"); $("pairView").classList.remove("hidden");
  if (msg) toast(msg, true);
}
$("pairBtn").onclick = () => {
  const v = $("pairInput").value.trim();
  const m = /pair=(kc_[\w-]+)/.exec(v) || /^(kc_[\w-]+)$/.exec(v);
  if (!m) return toast("没认出配对链接", true);
  store.set("kagura_token", m[1]);
  boot();
};

// ── 音频：一个共享的 AudioContext（iOS 要在用户点击里解锁一次） ──
let AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended" || AC.state === "interrupted") AC.resume();   // interrupted：iOS 来电 / 切 App 后
  return AC;
}
/**
 * iOS 上网页的 Web Audio 默认按「环境音」处理：侧面静音开关一开就完全没声（浏览器照样显示小喇叭）。
 * iOS 17+ 用 Audio Session API 声明成媒体播放；更早的版本在第一次点屏幕时用 <audio> 播一小段静音，
 * 系统会把整个页面切到媒体播放类别，之后 Web Audio 也不受静音开关影响。只有在点击 / 抬手里做才算数。
 */
let unlocked = false;
function unlockAudio(e) {
  if (!e || e.type !== "pointerdown") askMotion();          // iOS 只认 touchend / click 里申请传感器权限
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}

/** 边收边播：WAV 头（长度可能是占位值）+ 16 位单声道 PCM，攒够一点就排进播放队列 */
class Player {
  constructor() { this.t = 0; this.srcs = []; this.stopped = false; this.rate = 16000; }

/** 把一个 WAV 响应体边下边播（头里的采样率照着用） */

/** 发一轮：voice = WAV Blob；否则 /chat-vision（文字和/或照片）。处理同步 WAV 和异步长轮询两种回复 */
async function converse({ wav, text, image }) {
  if (S.busy) return;
  S.busy = true; S.cancelled = false; S.replyId = ""; S.herMsg = null;
  const h = devH({ "X-Stream": "1", "X-Async": "1", "X-Local-Time": localTime() });
  const meMsg = text || image ? addMsg("me", text || "", image ? image.url : null) : addMsg("me", "…");
  setState("她在想…", "点一下取消", "busy", "processing");
  let needPhoto = false, lastText = "";
  try {
    let r;
    if (wav && !image) r = await fetch("/chat", { method: "POST", headers: { ...h, "Content-Type": "audio/wav" }, body: wav });
    else {
      const body = { text: text || "" };
      if (image) body.image = image.b64;
      if (wav) body.wav = await blobB64(wav);
      r = await fetch("/chat-vision", { method: "POST", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    }
    if (r.status === 401) { unpair("令牌已失效，请重新配对"); return; }
    const userText = b64text(r.headers.get("X-User-Text"));
    if (userText && !text) meMsg.lastChild.textContent = userText;
    if (r.status === 202) {
      S.replyId = r.headers.get("X-Reply-Id") || "";
      for (;;) {
        if (S.cancelled) break;
        const g = await fetch(`/chat/reply/${S.replyId}?wait=20`, { headers: devH() });
        if (g.status === 204) { if (g.headers.get("X-Reply-Done")) break; continue; }
        if (!g.ok) throw new Error("取回复失败 HTTP " + g.status);
        ({ needPhoto, lastText } = await playSegment(g, needPhoto));
      }
    } else if (r.ok) {
      ({ needPhoto, lastText } = await playSegment(r, false));
      if (r.headers.get("X-Asr-Empty")) meMsg.lastChild.textContent = "（没听清）";
    } else {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || "HTTP " + r.status);
    }
    // 边生成边播时回复头里只有首句：说完取全文
    try {
      const last = await (await fetch("/chat/last", { headers: devH() })).json();
      if (last && last.reply && !S.cancelled) setHerText(last.reply);
      else if (lastText) setHerText(lastText);
    } catch { if (lastText) setHerText(lastText); }
    if (needPhoto && !S.cancelled) askPhoto();
  } catch (e) {
    addMsg("sys", "出错了：" + e.message);
  } finally {
    S.busy = false; S.replyId = ""; S.herMsg = null;
    if (S.player) { S.player = null; }
    setState("按住下面的按钮说话");
    drainPushes();
  }
}

}
async function drainPushes() {
  if (S.busy || S.draining) return;
  S.draining = true;
  try {
    while (S.pending.length && !S.busy) {
      const p = S.pending.shift();
      if (p.role && p.role !== S.role) { S.role = p.role; renderRoles(); }
      try {
        const r = await fetch(p.url);
        if (!r.ok) continue;
        if (p.text) addMsg("her", p.text); else addMsg("sys", "🔔 她有话说");
        setState("她在说…", "", "", "playing");
        S.player = new Player();
        await playResponse(r, S.player);
      } catch {}
    }
  } finally { S.draining = false; S.player = null; if (!S.busy) setState("按住下面的按钮说话"); }
}

// ── 看家：远程看 CoreS3 ──
const H = { dev: "", live: false, seq: -1, renew: 0, rid: "" };
function selDev() { return $("devSel").value || H.dev; }
async function refreshHome() {
  const devs = (S.me && S.me.devices) || [];
  const sel = $("devSel");
  if (!sel.options.length || sel.options.length !== devs.length) {
    sel.innerHTML = "";
    for (const d of devs) { const o = document.createElement("option"); o.value = d.id; o.textContent = d.id; sel.appendChild(o); }
    if (!devs.length) { const o = document.createElement("option"); o.value = ""; o.textContent = "还没有设备连上来"; sel.appendChild(o); }
  }
  const dev = selDev();
  if (!dev) { $("devKv").innerHTML = '<span class="faint">CoreS3 开机连上服务端后会出现在这里</span>'; return; }
  try {
    const st = await apiJson("/api/monitor/state?device_id=" + encodeURIComponent(dev));
    const d = st.devices[dev] || {};
    $("devDot").className = "dot " + (d.online ? "on" : "off");
    const ago = d.last_seen_secs_ago, agoText = ago == null ? "—" : ago < 60 ? "刚刚" : ago < 3600 ? Math.round(ago / 60) + " 分钟前" : Math.round(ago / 3600) + " 小时前";
    $("devKv").innerHTML = "";
    const kv = (k, v) => { const s = document.createElement("span"); s.innerHTML = k + " <b></b>"; s.lastChild.textContent = v; $("devKv").appendChild(s); };
    kv("状态", d.online ? "在线" : "离线"); kv("最近联系", agoText);
    if (d.bat != null) kv("电量", d.bat + "%" + (d.chg ? "（充电中）" : ""));
    if (d.rssi != null) kv("WiFi", d.rssi + " dBm");
    const shots = $("shots"); shots.innerHTML = "";
    const list = (st.snapshots || []).filter((s) => s.has_image).slice(0, 9);
    if (!list.length) shots.innerHTML = '<span class="faint" style="font-size:13px">还没有</span>';
    for (const s of list) {
      const i = document.createElement("img"); i.loading = "lazy"; i.alt = s.prompt || "";
      i.src = s.image_url + "?ct=" + encodeURIComponent(S.token);
      i.onclick = () => showPhoto(i.src, "");
      shots.appendChild(i);
    }
  } catch (e) { $("devKv").textContent = "读取失败：" + e.message; }
}
$("devSel").onchange = () => { stopLive(); refreshHome(); };

async function startLive() {
  const dev = selDev();
  if (!dev) return toast("没有可看的设备", true);
  try { await apiJson("/api/monitor/stream", { method: "POST", json: { device_id: dev, action: "start" } }); }
  catch (e) { return toast("开不了：" + e.message, true); }
  H.live = true; H.dev = dev; H.seq = -1;
  $("liveBtn").textContent = "停止"; $("liveHint").textContent = "连接中…（CoreS3 要几秒才开始推流）";
  // 网页每 20 秒续期一次，设备 45 秒没续期就自己停——关掉页面摄像头也不会一直开着
  H.renew = setInterval(() => api("/api/monitor/stream", { method: "POST", json: { device_id: dev, action: "start" } }).catch(() => {}), 20000);
  pollFrames(dev);
}
async function pollFrames(dev) {
  const img = $("liveImg");
  while (H.live && H.dev === dev) {
    try {
      const r = await api(`/stream/${encodeURIComponent(dev)}/frame.jpg?after=${H.seq}`);
      if (r.status === 200) {
        H.seq = Number(r.headers.get("X-Frame-Seq") || H.seq);
        const url = URL.createObjectURL(await r.blob());
        // 先解码再换（直接换没解码完的图会频闪，见 CLAUDE.md），复用同一个 <img>
        const next = new Image(); next.src = url;
        try { await next.decode(); } catch {}
        const old = img.src; img.src = url; img.classList.remove("hidden"); $("liveHint").classList.add("hidden");
        if (old.startsWith("blob:")) URL.revokeObjectURL(old);
      }
    } catch { await new Promise((r) => setTimeout(r, 1000)); }
  }
}
function stopLive() {
  if (!H.live) return;
  H.live = false; clearInterval(H.renew);
  api("/api/monitor/stream", { method: "POST", json: { device_id: H.dev, action: "stop" } }).catch(() => {});
  $("liveBtn").textContent = "开始看"; $("liveHint").textContent = "已停止"; $("liveHint").classList.remove("hidden"); $("liveImg").classList.add("hidden");
}
$("liveBtn").onclick = () => (H.live ? stopLive() : startLive());

async function capture(hires) {
  const dev = selDev();
  if (!dev) return toast("没有可拍的设备", true);
  $("snapBtn").disabled = $("hiresBtn").disabled = true;
  try {
    const d = await apiJson("/api/monitor/capture", { method: "POST", json: { device_id: dev, hires } });
    H.rid = d.request_id;
    if (d.status !== "done") {
      toast("CoreS3 正在拍…");
      for (let i = 0; i < 50; i++) {
        await new Promise((r) => setTimeout(r, 1000));
        const r = await api("/capture-result/" + H.rid);
        if (r.status === 200) break;
        if (r.status !== 202) throw new Error("拍照失败");
        if (i === 49) throw new Error("等太久了，设备可能离线");
      }
    }
    showPhoto(`/photo/${H.rid}?ct=${encodeURIComponent(S.token)}`, H.rid);
    refreshHome();
  } catch (e) { toast(e.message, true); }
  finally { $("snapBtn").disabled = $("hiresBtn").disabled = false; }
}
function showPhoto(src, rid) {
  $("photoImg").src = src; $("photoBox").classList.remove("hidden");
  $("describeBtn").classList.toggle("hidden", !rid); H.rid = rid;
}
$("snapBtn").onclick = () => capture(false);
$("hiresBtn").onclick = () => capture(true);
$("describeBtn").onclick = async () => {
  try { await apiJson("/api/monitor/describe", { method: "POST", json: { request_id: H.rid, device_id: selDev() } }); toast("好，她会在 CoreS3 上说"); }
  catch (e) { toast(e.message, true); }
};

// ── 页签 ──
function tab(name) {
  $("tabChat").classList.toggle("hidden", name === "chat"); $("tabHome").classList.toggle("hidden", name === "home");
  $("chatPage").classList.toggle("hidden", name !== "chat"); $("homePage").classList.toggle("hidden", name !== "home");
  if (name === "home") { loadMe().then(refreshHome); } else stopLive();
}
$("tabChat").onclick = () => tab("chat");
$("tabHome").onclick = () => tab("home");
// 离开前台（切 App、锁屏）就主动断开推送连接：iOS 会把后台页面挂起，连接却可能还挂着一阵——服务端以为页面开着，
// 推过来的话就丢了。断开后服务端立刻知道「没开」，主动说的话改去别的设备；回到前台再连上
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopLive(); if (S.es) { S.es.close(); S.es = null; $("conn").className = "dot"; $("connText").textContent = "已暂停"; } }
  else if (S.token) { connectEvents(); loadMe(); if (AC && AC.state !== "running") AC.resume().catch(() => {}); }
});
window.addEventListener("pagehide", () => { if (S.es) { S.es.close(); S.es = null; } });

// ── 启动 ──
async function loadMe() {
  const me = await apiJson("/client/me");
  S.me = me; S.roles = me.roles || []; S.role = me.role || "";
  renderRoles();
  return me;
}
// ── 摇一摇（同 CoreS3 的彩蛋：换 img_shake 那张图，她主动找你聊几句，回复走推送）──
// 浏览器只在 https 下给动作传感器；iOS 还要在一次点击里申请权限（第一次点屏幕时问）。
const SHAKE = { th: 13, count: 3, win: 700, cool: 20000 };   // 去掉重力后的加速度 m/s²；700ms 内 3 下；冷却 20 秒
let shakeHits = [], shakeLast = 0, motionAsked = false, motionOn = false;
function onMotion(e) {
  let m;
  const a = e.acceleration;
  if (a && a.x != null) m = Math.hypot(a.x, a.y, a.z);
  else { const g = e.accelerationIncludingGravity; if (!g || g.x == null) return; m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81); }
  if (m < SHAKE.th) return;
  const now = Date.now();
  if (shakeHits.length && now - shakeHits[shakeHits.length - 1] < 90) return;     // 同一下的尖峰只算一次
  shakeHits = shakeHits.filter((t) => now - t < SHAKE.win);
  shakeHits.push(now);
  if (shakeHits.length >= SHAKE.count) { shakeHits = []; onShake(now); }
}
async function onShake(now) {
  if (now - shakeLast < SHAKE.cool || S.busy || document.hidden || !$("homePage").classList.contains("hidden")) return;
  shakeLast = now;
  try { navigator.vibrate && navigator.vibrate(60); } catch {}
  showVis("shake");
  setTimeout(() => { if (S.vis === "shake") showVis("idle"); }, 2500);
  try {
    const r = await fetch("/shake", { headers: devH({ "X-Local-Time": localTime() }) });
    if (!r.ok) toast(r.status === 429 ? "摇得太频繁啦，歇一会儿" : "她没接住（" + r.status + "）", true);
  } catch { toast("连不上服务端", true); }
}
function startMotion() {
  if (motionOn) return;
  motionOn = true;
  window.addEventListener("devicemotion", onMotion);
}
/** 能直接听就直接听；iOS 要权限的话返回 false，等第一次点击里 askMotion() */
function initMotion() {
  if (!window.DeviceMotionEvent || !window.isSecureContext) return;
  if (typeof DeviceMotionEvent.requestPermission !== "function") startMotion();
}
function askMotion() {
  if (motionAsked || motionOn || !window.DeviceMotionEvent || !window.isSecureContext || typeof DeviceMotionEvent.requestPermission !== "function") return;
  motionAsked = true;
  DeviceMotionEvent.requestPermission().then((r) => { if (r === "granted") startMotion(); }).catch(() => { motionAsked = false; });
}

async function boot() {
  readPairFromHash();
  S.token = store.get("kagura_token");
  if (!S.token) { $("pairView").classList.remove("hidden"); $("appView").classList.add("hidden"); return; }
  try { await loadMe(); }
  catch (e) { if (S.token) { $("pairView").classList.remove("hidden"); toast("连不上服务端：" + e.message, true); } return; }
  $("pairView").classList.add("hidden"); $("appView").classList.remove("hidden");
  const canRec = !!window.isSecureContext && !!navigator.mediaDevices;
  $("insecure").classList.toggle("hidden", canRec || store.get("kagura_insecure_ok") === "1");
  $("modeBtn").classList.toggle("hidden", !canRec);
  if (!S.mode) setMode(canRec ? "voice" : "text");
  if (!$("log").children.length) {
    addMsg("sys", canRec ? "按住说话，或者点左边切换成打字" : "打字跟她聊吧");
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.audioSession) addMsg("sys", "没声音的话，看看手机侧面的静音开关");
  }
  initMotion();
  connectEvents();
}
// 已经开着页面时再打开配对链接（只改了 # 后面），页面不会重新加载
window.addEventListener("hashchange", () => { if (/pair=kc_/.test(location.hash)) boot(); });
$("insecureX").onclick = () => { store.set("kagura_insecure_ok", "1"); $("insecure").classList.add("hidden"); };
boot();
</script>
