<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#041c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kagura">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon.svg">
<link rel="apple-touch-icon" href="/app/icon.svg">
<title>Kagura</title>
<!--
  手机 / 平板客户端（服务端 /app，单文件、无外部依赖）。手机是一台和 CoreS3 并列的设备：
  用手机自己的麦克风、喇叭、摄像头跟她对话（/chat、/chat-vision、异步长轮询，协议同设备）；
  「看家」页用监控接口远程看 CoreS3（直播、拍照）。配对令牌存 localStorage，推送走 SSE（/client/events）。
  浏览器只在 HTTPS（或 localhost）下给麦克风 / 摄像头——局域网 http 地址打开时按住说话会被拦，见 README。
-->
<style>
:root {
  --bg:#041c1c; --panel:#0b2323; --panel2:#102a29; --fg:#ffe6cb; --muted:#ffe6cb99; --faint:#ffe6cb59;
  --line:#ffe6cb1f; --line2:#ffe6cb33; --accent:#ffbd38; --glow:#ffbd3826; --ok:#5fd4a0; --err:#ff7a6b;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
body { font:15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
input, select, textarea { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line2); border-radius:12px; padding:10px 12px; outline:none; min-width:0; }
input:focus, select:focus { border-color:var(--accent); }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.hidden { display:none !important; }

header { padding:calc(var(--safe-t) + 10px) 16px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
header .title { font-weight:600; font-size:17px; flex:1; display:flex; align-items:center; gap:8px; min-width:0; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); } .dot.off { background:var(--err); }
header select { padding:6px 10px; border-radius:20px; font-size:14px; max-width:42vw; }

main { flex:1; overflow:hidden; position:relative; }
.page { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; }

nav { display:flex; border-top:1px solid var(--line); padding-bottom:var(--safe-b); background:var(--panel); }
nav button { flex:1; padding:10px 0 8px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
nav button.sel { color:var(--accent); }
nav svg { width:22px; height:22px; }

/* ── 对话 ── */
.stage { position:relative; height:34vh; min-height:170px; max-height:320px; flex:none; overflow:hidden; background:var(--panel); }
.stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92; }
.stage .shade { position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, #041c1ccc); }
.stage .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px; color:var(--accent); letter-spacing:.05em; }
.stage .state { position:absolute; left:14px; bottom:12px; right:14px; font-size:13px; color:var(--fg); display:flex; align-items:center; gap:8px; }
.bars { display:inline-flex; gap:3px; align-items:flex-end; height:16px; }
.bars i { width:3px; background:var(--accent); border-radius:2px; height:4px; transition:height .08s; }

.log { flex:1; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
.msg { max-width:84%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-break:break-word; }
.msg.me { align-self:flex-end; background:var(--accent); color:#041c1c; border-bottom-right-radius:5px; }
.msg.her { align-self:flex-start; background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:5px; }
.msg.sys { align-self:center; background:none; color:var(--faint); font-size:12.5px; padding:2px 8px; text-align:center; }
.msg img { display:block; max-width:180px; max-height:180px; border-radius:10px; margin-bottom:6px; }
.msg .act { display:inline-block; margin-top:6px; color:var(--accent); font-weight:600; }

.composer { flex:none; padding:8px 12px 10px; border-top:1px solid var(--line); background:var(--bg); }
.attach { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px; color:var(--muted); }
.attach img { width:44px; height:44px; object-fit:cover; border-radius:8px; }
.row { display:flex; gap:8px; align-items:center; }
.row input { flex:1; }
.icon-btn { width:44px; height:44px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel2); border:1px solid var(--line2); }
.icon-btn svg { width:22px; height:22px; }
.talk { margin-top:10px; width:100%; height:64px; border-radius:32px; background:var(--panel2); border:1.5px solid var(--line2); font-size:16px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:10px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; transition:transform .1s, background .15s; }
.talk.rec { background:var(--accent); color:#041c1c; transform:scale(.98); border-color:var(--accent); box-shadow:0 0 0 8px var(--glow); }
.talk.busy { color:var(--muted); }
.talk.cancel { background:var(--err); color:#fff; border-color:var(--err); }

/* ── 看家 ── */
.home { overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px; }
.kv { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13.5px; color:var(--muted); }
.kv b { color:var(--fg); font-weight:500; }
.live { position:relative; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.live img { width:100%; height:100%; object-fit:contain; }
.live .hint { position:absolute; color:var(--faint); font-size:13px; text-align:center; padding:0 20px; }
.btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.btn { padding:9px 16px; border-radius:20px; background:var(--panel2); border:1px solid var(--line2); font-size:14px; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#041c1c; font-weight:600; }
.btn:disabled { opacity:.45; }
.shots { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.shots img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; background:var(--panel2); }
.photo { margin-top:10px; } .photo img { width:100%; border-radius:12px; }

/* ── 配对 ── */
.pair { flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px; gap:14px; }
.pair h1 { margin:0; font-size:24px; } .pair ol { margin:0; padding-left:20px; color:var(--muted); line-height:1.9; }

.toast { position:fixed; left:50%; bottom:calc(110px + var(--safe-b)); transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line2);
  padding:9px 16px; border-radius:20px; font-size:13.5px; max-width:88vw; z-index:9; box-shadow:0 6px 24px #0008; }
.toast.err { border-color:var(--err); }
.warnbar { background:#ff7a6b1f; color:#ffb4a8; font-size:12.5px; padding:7px 14px; border-bottom:1px solid #ff7a6b33; }
</style>
</head>
<body>

<div id="pairView" class="pair hidden">
  <h1>Kagura</h1>
  <p class="muted">这台手机还没配对。在电脑上：</p>
  <ol>
    <li>打开 Kagura 管理界面 → <b>设备</b> → <b>手机</b></li>
    <li>点「添加手机」，用手机相机扫二维码</li>
  </ol>
  <p class="faint" style="font-size:13px">也可以把管理界面给出的配对链接直接粘贴到下面：</p>
  <div class="row"><input id="pairInput" placeholder="https://…/app#pair=kc_…"><button class="btn primary" id="pairBtn">配对</button></div>
</div>

<div id="appView" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0">
  <header>
    <div class="title"><span class="dot" id="conn" title="推送连接"></span><span id="meName">Kagura</span></div>
    <select id="roleSel" aria-label="角色"></select>
  </header>
  <div id="insecure" class="warnbar hidden">当前不是 HTTPS 地址，浏览器不让网页直接录音，「按住说话」用不了。打字、听她说话、收推送、拍照、看家都正常——想说话可以点键盘上的麦克风键（语音输入）转成文字发送。</div>
  <main>
    <section class="page" id="chatPage">
      <div class="stage">
        <img id="bg" alt="" class="hidden">
        <div class="face" id="face">(｡･ω･｡)</div>
        <div class="shade"></div>
        <div class="state"><span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span><span id="stateText">按住下面的按钮说话</span></div>
      </div>
      <div class="log" id="log"></div>
      <div class="composer">
        <div class="attach hidden" id="attach"><img id="attachImg" alt=""><span>这张照片会跟下一句话一起发给她</span><button class="btn" id="attachX" style="padding:4px 10px">移除</button></div>
        <div class="row">
          <button class="icon-btn" id="camBtn" aria-label="拍照"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
          <input id="text" placeholder="打字也行…" enterkeyhint="send" autocomplete="off">
          <button class="icon-btn" id="sendBtn" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l16-8-6 16-2-7z"/></svg></button>
        </div>
        <button class="talk" id="talk"><span id="talkText">按住说话</span></button>
        <input type="file" accept="image/*" capture="environment" id="camInput" class="hidden">
      </div>
    </section>

    <section class="page hidden" id="homePage">
      <div class="home">
        <div class="card">
          <h3><span class="dot" id="devDot"></span><select id="devSel" style="padding:4px 10px; border-radius:16px; font-size:14px"></select></h3>
          <div class="kv" id="devKv"><span class="faint">读取中…</span></div>
        </div>
        <div class="card">
          <h3>实时画面</h3>
          <div class="live"><img id="liveImg" alt="" class="hidden"><div class="hint" id="liveHint">点「开始看」，CoreS3 的摄像头会开始推流（离开这页会自动停）</div></div>
          <div class="btns">
            <button class="btn primary" id="liveBtn">开始看</button>
            <button class="btn" id="snapBtn">拍一张</button>
            <button class="btn" id="hiresBtn">拍清晰版</button>
          </div>
          <div class="photo hidden" id="photoBox"><img id="photoImg" alt=""><div class="btns"><button class="btn" id="describeBtn">让她说说看到了什么</button></div></div>
        </div>
        <div class="card">
          <h3>最近的照片</h3>
          <div class="shots" id="shots"><span class="faint" style="font-size:13px">还没有</span></div>
        </div>
      </div>
    </section>
  </main>
  <nav>
    <button id="tabChat" class="sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>对话</button>
    <button id="tabHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9H3z"/><circle cx="12" cy="14" r="3"/></svg>看家</button>
  </nav>
</div>

<script>
"use strict";
// ── 基础 ──
const $ = (id) => document.getElementById(id);
const S = { token: "", me: null, role: "", roles: [], busy: false, replyId: "", player: null, pending: [], photo: null, cancelled: false };
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };

let toastTimer = 0;
function toast(text, err) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = text; t.classList.toggle("err", !!err); t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), err ? 4500 : 2500);
}
const authH = (h = {}) => ({ ...h, Authorization: "Bearer " + S.token });
const devH = (h = {}) => authH({ "X-Device-Id": S.me ? S.me.id : "", ...h });
async function api(path, opts = {}) {
  const headers = authH(opts.headers || {});
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) { unpair("令牌已失效，请重新配对"); throw new Error("未配对"); }
  return r;
}
async function apiJson(path, opts) {
  const r = await api(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
/** 响应头里的 b64 UTF-8 文本（X-User-Text / X-Reply-Text） */
function b64text(v) {
  if (!v) return "";
  try { return new TextDecoder().decode(Uint8Array.from(atob(v), (c) => c.charCodeAt(0))); } catch { return ""; }
}
function localTime() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── 配对 ──
function readPairFromHash() {
  const m = /[#&]pair=(kc_[\w-]+)/.exec(location.hash);
  if (!m) return false;
  store.set("kagura_token", m[1]);
  history.replaceState(null, "", location.pathname);   // 令牌别留在地址栏里
  return true;
}
function unpair(msg) {
  store.set("kagura_token", "");
  S.token = ""; S.me = null;
  if (S.es) S.es.close();
  $("appView").classList.add("hidden"); $("pairView").classList.remove("hidden");
  if (msg) toast(msg, true);
}
$("pairBtn").onclick = () => {
  const v = $("pairInput").value.trim();
  const m = /pair=(kc_[\w-]+)/.exec(v) || /^(kc_[\w-]+)$/.exec(v);
  if (!m) return toast("没认出配对链接", true);
  store.set("kagura_token", m[1]);
  boot();
};

// ── 音频：一个共享的 AudioContext（iOS 要在用户点击里解锁一次） ──
let AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
  return AC;
}
document.addEventListener("pointerdown", () => { try { ac(); } catch {} }, { once: true, capture: true });

/** 边收边播：WAV 头（长度可能是占位值）+ 16 位单声道 PCM，攒够一点就排进播放队列 */
class Player {
  constructor() { this.t = 0; this.srcs = []; this.stopped = false; this.rate = 16000; }
  feed(int16) {
    if (this.stopped || !int16.length) return;
    const ctx = ac();
    const f = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f[i] = int16[i] / 32768;
    const buf = ctx.createBuffer(1, f.length, this.rate);
    buf.copyToChannel(f, 0);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    const at = Math.max(ctx.currentTime + 0.06, this.t);
    src.start(at);
    this.t = at + buf.duration;
    this.srcs.push(src);
    src.onended = () => { this.srcs = this.srcs.filter((s) => s !== src); };
  }
  stop() { this.stopped = true; for (const s of this.srcs) { try { s.stop(); } catch {} } this.srcs = []; }
  /** 等排好的都播完 */
  async drain() { while (!this.stopped && AC && AC.currentTime < this.t) await new Promise((r) => setTimeout(r, 80)); }
}

/** 把一个 WAV 响应体边下边播（头里的采样率照着用） */
async function playResponse(resp, player) {
  const reader = resp.body.getReader();
  let head = new Uint8Array(0), started = false, carry = null, pend = [], pendBytes = 0;
  const flush = (force) => {
    const min = player.rate * 2 * (player.t ? 0.25 : 0.4);      // 第一块多攒一点，免得开头卡顿
    if (!force && pendBytes < min) return;
    let all = new Uint8Array(pendBytes), o = 0;
    for (const p of pend) { all.set(p, o); o += p.length; }
    pend = []; pendBytes = 0;
    if (all.length & 1) { pend.push(all.slice(-1)); pendBytes = 1; all = all.slice(0, -1); }
    player.feed(new Int16Array(all.buffer, all.byteOffset, all.length / 2));
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (player.stopped) { try { reader.cancel(); } catch {} return; }
    if (value && value.length) {
      if (!started) {
        const merged = new Uint8Array(head.length + value.length); merged.set(head); merged.set(value, head.length); head = merged;
        if (head.length < 64 && !done) continue;
        let off = 0;
        if (head[0] === 0x52 && head[1] === 0x49) {           // "RI"FF
          player.rate = new DataView(head.buffer).getUint32(24, true) || 16000;
          for (let i = 12; i < Math.min(head.length - 8, 512); i++) {
            if (head[i] === 0x64 && head[i + 1] === 0x61 && head[i + 2] === 0x74 && head[i + 3] === 0x61) { off = i + 8; break; }   // "data"
          }
          if (!off) off = 44;
        }
        started = true;
        const rest = head.slice(off);
        if (rest.length) { pend.push(rest); pendBytes += rest.length; }
      } else { pend.push(value); pendBytes += value.length; }
      flush(false);
    }
    if (done) break;
  }
  flush(true);
  await player.drain();
}

// ── 录音：ScriptProcessor 收原始采样，抬手后转 16k 单声道 16 位 WAV ──
const REC = { stream: null, src: null, proc: null, chunks: [], rate: 48000, t0: 0 };
async function startRec() {
  const ctx = ac();
  REC.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  REC.src = ctx.createMediaStreamSource(REC.stream);
  REC.proc = ctx.createScriptProcessor(4096, 1, 1);
  REC.chunks = []; REC.rate = ctx.sampleRate; REC.t0 = Date.now();
  REC.proc.onaudioprocess = (e) => {
    const d = e.inputBuffer.getChannelData(0);
    REC.chunks.push(new Float32Array(d));
    let s = 0; for (let i = 0; i < d.length; i += 16) s += d[i] * d[i];
    meter(Math.min(1, Math.sqrt(s / (d.length / 16)) * 6));
  };
  REC.src.connect(REC.proc); REC.proc.connect(ctx.destination);   // 不接到输出有些浏览器不回调；输出是静音
}
function stopRec() {
  try { REC.proc && REC.proc.disconnect(); REC.src && REC.src.disconnect(); } catch {}
  if (REC.stream) REC.stream.getTracks().forEach((t) => t.stop());
  REC.stream = null; meter(0);
  const ms = Date.now() - REC.t0;
  const n = REC.chunks.reduce((a, c) => a + c.length, 0);
  if (!n) return { ms, wav: null };
  const all = new Float32Array(n); let o = 0;
  for (const c of REC.chunks) { all.set(c, o); o += c.length; }
  return { ms, wav: toWav16k(all, REC.rate) };
}
function toWav16k(f, rate) {
  const ratio = rate / 16000, outN = Math.floor(f.length / ratio);
  const pcm = new Int16Array(outN);
  for (let i = 0; i < outN; i++) {
    const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b && j < f.length; j++) s += f[j];     // 窗口平均 = 简单低通，降采样不刺耳
    pcm[i] = Math.max(-32768, Math.min(32767, Math.round(s / (b - a) * 32767)));
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true);
  v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}
function meter(level) {
  const bars = $("bars").children;
  for (let i = 0; i < bars.length; i++) bars[i].style.height = (4 + Math.round(level * 12 * (0.6 + 0.4 * Math.sin(i * 1.7 + Date.now() / 120)))) + "px";
}

// ── 界面状态 ──
function setState(text, talkText, cls) {
  $("stateText").textContent = text;
  $("talkText").textContent = talkText || "按住说话";
  $("talk").className = "talk" + (cls ? " " + cls : "");
}
function addMsg(kind, text, img) {
  const d = document.createElement("div");
  d.className = "msg " + kind;
  if (img) { const i = document.createElement("img"); i.src = img; d.appendChild(i); }
  d.appendChild(document.createTextNode(text || ""));        // 总有一个文字节点：识别结果回来后改它
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function setBg(roleId) {
  const tryLoad = (paths) => {
    if (!paths.length) { $("bg").classList.add("hidden"); $("face").classList.remove("hidden"); return; }
    const img = new Image();
    img.onload = async () => { try { await img.decode(); } catch {} $("bg").src = img.src; $("bg").classList.remove("hidden"); $("face").classList.add("hidden"); };
    img.onerror = () => tryLoad(paths.slice(1));
    img.src = "/device/file?p=" + encodeURIComponent(paths[0]);
  };
  tryLoad([roleId ? `resource/${roleId}/img_bg.jpg` : "", "resource/img_bg.jpg"].filter(Boolean));
}
function renderRoles() {
  const sel = $("roleSel");
  sel.innerHTML = "";
  for (const r of S.roles) { const o = document.createElement("option"); o.value = r.id; o.textContent = r.name; sel.appendChild(o); }
  sel.value = S.role;
  sel.classList.toggle("hidden", S.roles.length < 2);
  const cur = S.roles.find((r) => r.id === S.role);
  $("meName").textContent = cur ? cur.name : "Kagura";
  setBg(S.role);
}
$("roleSel").onchange = async (e) => {
  const id = e.target.value;
  try {
    const d = await apiJson("/role", { method: "POST", json: { device_id: S.me.id, role: id, greet: true } });
    S.role = d.role; renderRoles();
    addMsg("sys", `换成了${d.name}`);
  } catch (err) { toast("切换失败：" + err.message, true); renderRoles(); }
};

// ── 对话 ──
/** 发一轮：voice = WAV Blob；否则 /chat-vision（文字和/或照片）。处理同步 WAV 和异步长轮询两种回复 */
async function converse({ wav, text, image }) {
  if (S.busy) return;
  S.busy = true; S.cancelled = false; S.replyId = ""; S.herMsg = null;
  const h = devH({ "X-Stream": "1", "X-Async": "1", "X-Local-Time": localTime() });
  const meMsg = text || image ? addMsg("me", text || "", image ? image.url : null) : addMsg("me", "…");
  setState("她在想…", "点一下取消", "busy");
  let needPhoto = false, lastText = "";
  try {
    let r;
    if (wav && !image) r = await fetch("/chat", { method: "POST", headers: { ...h, "Content-Type": "audio/wav" }, body: wav });
    else {
      const body = { text: text || "" };
      if (image) body.image = image.b64;
      if (wav) body.wav = await blobB64(wav);
      r = await fetch("/chat-vision", { method: "POST", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    }
    if (r.status === 401) { unpair("令牌已失效，请重新配对"); return; }
    const userText = b64text(r.headers.get("X-User-Text"));
    if (userText && !text) meMsg.lastChild.textContent = userText;
    if (r.status === 202) {
      S.replyId = r.headers.get("X-Reply-Id") || "";
      for (;;) {
        if (S.cancelled) break;
        const g = await fetch(`/chat/reply/${S.replyId}?wait=20`, { headers: devH() });
        if (g.status === 204) { if (g.headers.get("X-Reply-Done")) break; continue; }
        if (!g.ok) throw new Error("取回复失败 HTTP " + g.status);
        ({ needPhoto, lastText } = await playSegment(g, needPhoto));
      }
    } else if (r.ok) {
      ({ needPhoto, lastText } = await playSegment(r, false));
      if (r.headers.get("X-Asr-Empty")) meMsg.lastChild.textContent = "（没听清）";
    } else {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || "HTTP " + r.status);
    }
    // 边生成边播时回复头里只有首句：说完取全文
    try {
      const last = await (await fetch("/chat/last", { headers: devH() })).json();
      if (last && last.reply && !S.cancelled) setHerText(last.reply);
      else if (lastText) setHerText(lastText);
    } catch { if (lastText) setHerText(lastText); }
    if (needPhoto && !S.cancelled) askPhoto();
  } catch (e) {
    addMsg("sys", "出错了：" + e.message);
  } finally {
    S.busy = false; S.replyId = ""; S.herMsg = null;
    if (S.player) { S.player = null; }
    setState("按住下面的按钮说话");
    drainPushes();
  }
}
function setHerText(t) {
  if (!S.herMsg) S.herMsg = addMsg("her", t); else S.herMsg.textContent = t;
  $("log").scrollTop = $("log").scrollHeight;
}
async function playSegment(resp, needPhoto) {
  const t = b64text(resp.headers.get("X-Reply-Text"));
  if (t) setHerText(t + (resp.headers.get("X-Reply-Partial") ? "…" : ""));
  const role = resp.headers.get("X-Role");
  if (role && role !== S.role) { S.role = role; renderRoles(); }
  setState("她在说…", "点一下停下", "busy");
  S.player = new Player();
  await playResponse(resp, S.player);
  setState("她在想…", "点一下取消", "busy");
  return { needPhoto: needPhoto || resp.headers.get("X-Need-Photo") === "1", lastText: t };
}
function cancelTurn() {
  S.cancelled = true;
  if (S.player) S.player.stop();
  if (S.replyId) fetch(`/chat/cancel/${S.replyId}`, { method: "POST", headers: devH() }).catch(() => {});
  addMsg("sys", "已取消");
}
function blobB64(blob) {
  return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).replace(/^data:[^,]*,/, "")); r.onerror = bad; r.readAsDataURL(blob); });
}

// 按住说话：按下开始录，抬手发送；太短当误触；对话中点一下 = 取消
let pressing = false;
$("talk").addEventListener("contextmenu", (e) => e.preventDefault());
$("talk").addEventListener("pointerdown", async (e) => {
  e.preventDefault();
  if (S.busy) { cancelTurn(); return; }
  if (S.draining && S.player) S.player.stop();           // 正在播推送：先停
  if (!window.isSecureContext || !navigator.mediaDevices) { toast("http 地址下浏览器不让网页录音：可以用键盘上的语音输入，转成文字发送", true); return; }
  pressing = true;
  try { $("talk").setPointerCapture(e.pointerId); } catch {}
  setState("在听…松开就发送", "松开发送", "rec");
  try { await startRec(); } catch (err) { pressing = false; setState("按住下面的按钮说话"); toast("用不了麦克风：" + (err.message || err.name), true); return; }
  if (!pressing) finishRec();            // 按得太快，录音刚起来手已经抬了
});
const endPress = () => { if (!pressing) return; pressing = false; finishRec(); };
$("talk").addEventListener("pointerup", endPress);
$("talk").addEventListener("pointercancel", endPress);
function finishRec() {
  if (!REC.stream) return;
  const { ms, wav } = stopRec();
  setState("按住下面的按钮说话");
  if (!wav || ms < 450) { toast("按住说话，说完再松开"); return; }
  const photo = S.photo; clearPhoto();
  converse({ wav, image: photo });
}

// 打字
function sendText() {
  const t = $("text").value.trim();
  if (!t && !S.photo) return;
  if (S.busy) return toast("她还在说，等一下或者先点按钮取消");
  ac();
  $("text").value = "";
  const photo = S.photo; clearPhoto();
  converse({ text: t, image: photo });
}
$("sendBtn").onclick = sendText;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendText(); } });

// 拍照：缩到长边 1280 的 JPEG（手机原图好几 MB，服务端上限 5MB）
$("camBtn").onclick = () => $("camInput").click();
$("camInput").onchange = async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  try {
    S.photo = await shrink(f);
    $("attachImg").src = S.photo.url; $("attach").classList.remove("hidden");
    if (S.autoSendPhoto) { S.autoSendPhoto = false; const p = S.photo; clearPhoto(); converse({ text: S.photoQuestion || "", image: p }); }
  } catch (err) { toast("照片读不出来：" + err.message, true); }
};
$("attachX").onclick = clearPhoto;
function clearPhoto() { S.photo = null; $("attach").classList.add("hidden"); }
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.82);
    return { url: data, b64: data.replace(/^data:[^,]*,/, "") };
  } finally { URL.revokeObjectURL(url); }
}
/** 她说「我看看」（X-Need-Photo）：浏览器不让自动开相机，给个按钮让人点 */
function askPhoto() {
  const m = addMsg("her", "想看看的话，拍张照片给我吧。");
  const a = document.createElement("div"); a.className = "act"; a.textContent = "📷 点这里拍照";
  a.onclick = () => { S.autoSendPhoto = true; S.photoQuestion = ""; $("camInput").click(); };
  m.appendChild(a);
}

// ── 推送（SSE）：服务端发给这台手机的话（提醒、换角色问候……） ──
function connectEvents() {
  if (S.es) S.es.close();
  const es = new EventSource("/client/events?ct=" + encodeURIComponent(S.token));
  S.es = es;
  es.onopen = () => { $("conn").className = "dot on"; };
  es.onerror = () => { $("conn").className = "dot off"; };
  es.addEventListener("push", (e) => { try { S.pending.push(JSON.parse(e.data)); drainPushes(); } catch {} });
  es.addEventListener("cmd", (e) => {
    let d = {}; try { d = JSON.parse(e.data); } catch {}
    if (d.action === "role" && d.role) { S.role = d.role; renderRoles(); }
    else if (d.action === "capture") addMsg("sys", "她想拍照：点左下角相机拍一张发给她");
  });
}
async function drainPushes() {
  if (S.busy || S.draining) return;
  S.draining = true;
  try {
    while (S.pending.length && !S.busy) {
      const p = S.pending.shift();
      if (p.role && p.role !== S.role) { S.role = p.role; renderRoles(); }
      try {
        const r = await fetch(p.url);
        if (!r.ok) continue;
        addMsg("sys", "🔔 她有话说");
        setState("她在说…");
        S.player = new Player();
        await playResponse(r, S.player);
      } catch {}
    }
  } finally { S.draining = false; S.player = null; if (!S.busy) setState("按住下面的按钮说话"); }
}

// ── 看家：远程看 CoreS3 ──
const H = { dev: "", live: false, seq: -1, renew: 0, rid: "" };
function selDev() { return $("devSel").value || H.dev; }
async function refreshHome() {
  const devs = (S.me && S.me.devices) || [];
  const sel = $("devSel");
  if (!sel.options.length || sel.options.length !== devs.length) {
    sel.innerHTML = "";
    for (const d of devs) { const o = document.createElement("option"); o.value = d.id; o.textContent = d.id; sel.appendChild(o); }
    if (!devs.length) { const o = document.createElement("option"); o.value = ""; o.textContent = "还没有设备连上来"; sel.appendChild(o); }
  }
  const dev = selDev();
  if (!dev) { $("devKv").innerHTML = '<span class="faint">CoreS3 开机连上服务端后会出现在这里</span>'; return; }
  try {
    const st = await apiJson("/api/monitor/state?device_id=" + encodeURIComponent(dev));
    const d = st.devices[dev] || {};
    $("devDot").className = "dot " + (d.online ? "on" : "off");
    const ago = d.last_seen_secs_ago, agoText = ago == null ? "—" : ago < 60 ? "刚刚" : ago < 3600 ? Math.round(ago / 60) + " 分钟前" : Math.round(ago / 3600) + " 小时前";
    $("devKv").innerHTML = "";
    const kv = (k, v) => { const s = document.createElement("span"); s.innerHTML = k + " <b></b>"; s.lastChild.textContent = v; $("devKv").appendChild(s); };
    kv("状态", d.online ? "在线" : "离线"); kv("最近联系", agoText);
    if (d.bat != null) kv("电量", d.bat + "%" + (d.chg ? "（充电中）" : ""));
    if (d.rssi != null) kv("WiFi", d.rssi + " dBm");
    const shots = $("shots"); shots.innerHTML = "";
    const list = (st.snapshots || []).filter((s) => s.has_image).slice(0, 9);
    if (!list.length) shots.innerHTML = '<span class="faint" style="font-size:13px">还没有</span>';
    for (const s of list) {
      const i = document.createElement("img"); i.loading = "lazy"; i.alt = s.prompt || "";
      i.src = s.image_url + "?ct=" + encodeURIComponent(S.token);
      i.onclick = () => showPhoto(i.src, "");
      shots.appendChild(i);
    }
  } catch (e) { $("devKv").textContent = "读取失败：" + e.message; }
}
$("devSel").onchange = () => { stopLive(); refreshHome(); };

async function startLive() {
  const dev = selDev();
  if (!dev) return toast("没有可看的设备", true);
  try { await apiJson("/api/monitor/stream", { method: "POST", json: { device_id: dev, action: "start" } }); }
  catch (e) { return toast("开不了：" + e.message, true); }
  H.live = true; H.dev = dev; H.seq = -1;
  $("liveBtn").textContent = "停止"; $("liveHint").textContent = "连接中…（CoreS3 要几秒才开始推流）";
  // 网页每 20 秒续期一次，设备 45 秒没续期就自己停——关掉页面摄像头也不会一直开着
  H.renew = setInterval(() => api("/api/monitor/stream", { method: "POST", json: { device_id: dev, action: "start" } }).catch(() => {}), 20000);
  pollFrames(dev);
}
async function pollFrames(dev) {
  const img = $("liveImg");
  while (H.live && H.dev === dev) {
    try {
      const r = await api(`/stream/${encodeURIComponent(dev)}/frame.jpg?after=${H.seq}`);
      if (r.status === 200) {
        H.seq = Number(r.headers.get("X-Frame-Seq") || H.seq);
        const url = URL.createObjectURL(await r.blob());
        // 先解码再换（直接换没解码完的图会频闪，见 CLAUDE.md），复用同一个 <img>
        const next = new Image(); next.src = url;
        try { await next.decode(); } catch {}
        const old = img.src; img.src = url; img.classList.remove("hidden"); $("liveHint").classList.add("hidden");
        if (old.startsWith("blob:")) URL.revokeObjectURL(old);
      }
    } catch { await new Promise((r) => setTimeout(r, 1000)); }
  }
}
function stopLive() {
  if (!H.live) return;
  H.live = false; clearInterval(H.renew);
  api("/api/monitor/stream", { method: "POST", json: { device_id: H.dev, action: "stop" } }).catch(() => {});
  $("liveBtn").textContent = "开始看"; $("liveHint").textContent = "已停止"; $("liveHint").classList.remove("hidden"); $("liveImg").classList.add("hidden");
}
$("liveBtn").onclick = () => (H.live ? stopLive() : startLive());

async function capture(hires) {
  const dev = selDev();
  if (!dev) return toast("没有可拍的设备", true);
  $("snapBtn").disabled = $("hiresBtn").disabled = true;
  try {
    const d = await apiJson("/api/monitor/capture", { method: "POST", json: { device_id: dev, hires } });
    H.rid = d.request_id;
    if (d.status !== "done") {
      toast("CoreS3 正在拍…");
      for (let i = 0; i < 50; i++) {
        await new Promise((r) => setTimeout(r, 1000));
        const r = await api("/capture-result/" + H.rid);
        if (r.status === 200) break;
        if (r.status !== 202) throw new Error("拍照失败");
        if (i === 49) throw new Error("等太久了，设备可能离线");
      }
    }
    showPhoto(`/photo/${H.rid}?ct=${encodeURIComponent(S.token)}`, H.rid);
    refreshHome();
  } catch (e) { toast(e.message, true); }
  finally { $("snapBtn").disabled = $("hiresBtn").disabled = false; }
}
function showPhoto(src, rid) {
  $("photoImg").src = src; $("photoBox").classList.remove("hidden");
  $("describeBtn").classList.toggle("hidden", !rid); H.rid = rid;
}
$("snapBtn").onclick = () => capture(false);
$("hiresBtn").onclick = () => capture(true);
$("describeBtn").onclick = async () => {
  try { await apiJson("/api/monitor/describe", { method: "POST", json: { request_id: H.rid, device_id: selDev() } }); toast("好，她会在 CoreS3 上说"); }
  catch (e) { toast(e.message, true); }
};

// ── 页签 ──
function tab(name) {
  $("tabChat").classList.toggle("sel", name === "chat"); $("tabHome").classList.toggle("sel", name === "home");
  $("chatPage").classList.toggle("hidden", name !== "chat"); $("homePage").classList.toggle("hidden", name !== "home");
  if (name === "home") { loadMe().then(refreshHome); } else stopLive();
}
$("tabChat").onclick = () => tab("chat");
$("tabHome").onclick = () => tab("home");
// 离开前台（切 App、锁屏）就主动断开推送连接：iOS 会把后台页面挂起，连接却可能还挂着一阵——服务端以为页面开着，
// 推过来的话就丢了。断开后服务端立刻知道「没开」，主动说的话改去别的设备；回到前台再连上
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopLive(); if (S.es) { S.es.close(); S.es = null; $("conn").className = "dot"; } }
  else if (S.token) { connectEvents(); loadMe(); }
});
window.addEventListener("pagehide", () => { if (S.es) { S.es.close(); S.es = null; } });

// ── 启动 ──
async function loadMe() {
  const me = await apiJson("/client/me");
  S.me = me; S.roles = me.roles || []; S.role = me.role || "";
  renderRoles();
  return me;
}
async function boot() {
  readPairFromHash();
  S.token = store.get("kagura_token");
  if (!S.token) { $("pairView").classList.remove("hidden"); $("appView").classList.add("hidden"); return; }
  try { await loadMe(); }
  catch (e) { if (S.token) { $("pairView").classList.remove("hidden"); toast("连不上服务端：" + e.message, true); } return; }
  $("pairView").classList.add("hidden"); $("appView").classList.remove("hidden");
  $("insecure").classList.toggle("hidden", !!window.isSecureContext);
  if (!$("log").children.length) addMsg("sys", `已连接（${S.me.name}）。按住下面的按钮说话，或者直接打字。`);
  connectEvents();
}
// 已经开着页面时再打开配对链接（只改了 # 后面），页面不会重新加载
window.addEventListener("hashchange", () => { if (/pair=kc_/.test(location.hash)) boot(); });
boot();
</script>
