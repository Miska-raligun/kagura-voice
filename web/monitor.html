<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神楽监控 · CoreS3</title>
<style>
  :root{
    --bg:#12131a; --panel:#1b1d27; --panel2:#232634; --line:#2f3344;
    --fg:#e8eaf2; --dim:#9aa0b5; --accent:#5fd6c8; --warn:#f0b455; --bad:#f0645f;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg); font-size:15px; line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
                "Helvetica Neue",Arial,sans-serif;
    padding:0 14px 48px; max-width:960px; margin:0 auto;
  }
  h1{font-size:19px; margin:0; letter-spacing:.5px}
  h2{font-size:15px; margin:0 0 12px; color:var(--dim); font-weight:600;
     letter-spacing:.5px; text-transform:uppercase}
  header{display:flex; align-items:center; gap:12px; padding:18px 2px 14px;
         position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap}
  .spacer{flex:1}
  section{background:var(--panel); border:1px solid var(--line);
          border-radius:var(--radius); padding:16px; margin-bottom:16px}
  button{
    font:inherit; font-size:14px; color:var(--fg); background:var(--panel2);
    border:1px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45; cursor:default}
  button.primary{background:var(--accent); color:#0d1a19;
                 border-color:var(--accent); font-weight:600}
  button.danger:hover{border-color:var(--bad); color:var(--bad)}
  button.mini{padding:5px 9px; font-size:13px}
  input,select,textarea{
    font:inherit; font-size:14px; color:var(--fg); background:var(--panel2);
    border:1px solid var(--line); border-radius:9px; padding:8px 10px;
  }
  textarea{width:100%; resize:vertical; min-height:56px; line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent)}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .dim{color:var(--dim)}
  .small{font-size:13px}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;
       background:var(--dim); flex:none}
  .dot.on{background:var(--accent); box-shadow:0 0 8px var(--accent)}
  .dot.off{background:var(--bad)}
  .pill{display:inline-flex; align-items:center; gap:7px; background:var(--panel2);
        border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px}

  /* ── 实时画面 ── */
  #stage{
    position:relative; background:#0a0b10; border:1px solid var(--line);
    border-radius:12px; overflow:hidden; aspect-ratio:4/3;
    /* 摄像头本身才 320×240，宽屏下别让空画面撑出半屏黑框 */
    max-height:min(58vh, 460px);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
  }
  #stage img{width:100%; height:100%; object-fit:contain; display:block}
  #stageMsg{position:absolute; color:var(--dim); font-size:14px; text-align:center;
            padding:20px; pointer-events:none}
  #stage.busy::after{
    content:""; position:absolute; inset:0; border:2px solid var(--accent);
    border-radius:12px; animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
  #strip{display:flex; gap:8px; overflow-x:auto; padding-top:12px}
  #strip img{height:62px; width:82px; object-fit:cover; border-radius:8px;
             border:1px solid var(--line); cursor:pointer; flex:none}
  #strip img:hover{border-color:var(--accent)}

  /* ── 定时计划 ── */
  .sched{border:1px solid var(--line); border-radius:11px; padding:12px;
         margin-bottom:10px; background:var(--panel2)}
  .sched.off{opacity:.5}
  .sched .time{font-size:22px; font-variant-numeric:tabular-nums; font-weight:600}
  .sched .prompt{font-size:13px; color:var(--dim); margin:8px 0 0;
                 white-space:pre-wrap; word-break:break-word}
  .sched .last{font-size:13px; margin-top:8px; padding-top:8px;
               border-top:1px dashed var(--line); color:var(--dim)}
  .err{color:var(--bad)}
  .ok{color:var(--accent)}

  /* ── 快照留档 ── */
  #snaps{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .snap{border:1px solid var(--line); border-radius:11px; overflow:hidden;
        background:var(--panel2); display:flex; flex-direction:column}
  .snap .thumb{aspect-ratio:4/3; background:#0a0b10; display:flex;
               align-items:center; justify-content:center; color:var(--dim); font-size:13px}
  .snap .thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer}
  .snap .meta{padding:9px 11px; font-size:13px}
  .snap .meta .when{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}
  .snap .meta .reply{margin-top:5px; word-break:break-word}

  #lightbox{position:fixed; inset:0; background:#000c; display:none; z-index:50;
            align-items:center; justify-content:center; padding:20px; cursor:zoom-out}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px}
  #toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
         background:var(--panel2); border:1px solid var(--line); border-radius:10px;
         padding:10px 18px; font-size:14px; z-index:60; display:none; max-width:90vw}
</style>
</head>
<body>

<header>
  <h1>神楽监控</h1>
  <input type="text" id="devInput" value="cores3" size="7" title="设备 ID">
  <span class="pill"><span class="dot" id="devDot"></span><span id="devText">加载中…</span></span>
  <span class="spacer"></span>
  <span class="small dim" id="clock"></span>
  <button class="mini" id="btnToken">密钥</button>
</header>

<section>
  <h2>实时画面</h2>
  <div id="stage">
    <span id="stageMsg">点「拍一张」让设备拍照</span>
  </div>
  <div class="row">
    <button class="primary" id="btnShot">📷 拍一张</button>
    <button id="btnHires" hidden>🔍 高清拍</button>
    <button id="btnLive">🔴 直播</button>
    <label class="row small dim" style="gap:6px">
      自动
      <select id="selAuto">
        <option value="0">关</option>
        <option value="5">5 秒</option>
        <option value="10">10 秒</option>
        <option value="30">30 秒</option>
        <option value="60">1 分钟</option>
        <option value="300">5 分钟</option>
      </select>
    </label>
    <span class="spacer"></span>
    <span class="small dim" id="shotStatus"></span>
  </div>
  <label class="row small dim" style="gap:7px; margin-top:10px">
    <input type="checkbox" id="chkSpeak" style="width:16px;height:16px">
    拍完让它看一眼并说一句（只对手动按快门生效，自动刷新不会触发）。
    直播中「抓拍这一帧」是 160×120，要给它看清楚就用「高清拍」——
    临时切回 320×240 拍一张，画面会停几秒
  </label>
  <div id="strip"></div>
</section>

<section>
  <h2>每日定时拍照</h2>
  <div id="schedList"><p class="dim small">加载中…</p></div>
  <div style="border-top:1px solid var(--line); padding-top:14px; margin-top:4px">
    <div class="row" style="margin-bottom:10px">
      <input type="time" id="newTime" value="08:00" required>
      <button class="primary" id="btnAdd">添加</button>
      <span class="small dim">用顶栏那台设备</span>
    </div>
    <textarea id="newPrompt" placeholder="要问它什么（留空则不作限定，让它自己看图发挥）"></textarea>
  </div>
</section>

<section>
  <h2>快照留档</h2>
  <div id="snaps"><p class="dim small">加载中…</p></div>
</section>

<div id="lightbox"><img alt="放大"></div>
<div id="toast"></div>

<script>
"use strict";

const $ = (s) => document.querySelector(s);
const TOKEN_KEY = "kagura_api_token";
let token = localStorage.getItem(TOKEN_KEY) || "";
let capturing = false;      // 防止自动刷新与手动点击叠在一起打爆设备
let autoTimer = null;
let authPrompted = false;   // 401 只弹一次问密钥，否则 15 秒一次的轮询会弹个不停
let stageUrl = null;        // 大图当前用的 objectURL，回收缩略图时别把它撤掉
let streaming = false;      // 直播中：与自动刷新互斥；「拍一张」改为抓当前帧
let streamSeq = -1;         // 已显示到第几帧，长轮询靠它判断有没有新帧
let streamUrl = null;       // 当前直播帧的 objectURL，换帧时回收上一张
let streamKeepalive = null;
const blobCache = new Map(); // 快照名 → objectURL，避免重复下载和 URL 泄漏
const rendered = {};        // 上次渲染内容的指纹，没变就不重绘（免得每 15 秒闪一下）

function headers(extra) {
  const h = Object.assign({}, extra || {});
  if (token) h["X-Api-Token"] = token;
  return h;
}

function toast(msg, ms) {
  const el = $("#toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, ms || 2600);
}

async function api(path, opts) {
  const o = Object.assign({}, opts || {});
  o.headers = headers(o.headers);
  const resp = await fetch(path, o);
  if (resp.status === 401) {
    if (!authPrompted) {
      authPrompted = true;
      askToken("需要访问密钥（config.py 里的 API_TOKEN）");
    }
    throw new Error("未授权");
  }
  return resp;
}

async function apiJson(path, opts) {
  const resp = await api(path, opts);
  let data = null;
  try { data = await resp.json(); } catch (e) { /* 空响应体 */ }
  if (!resp.ok) throw new Error((data && data.error) || ("HTTP " + resp.status));
  return data;
}

function askToken(msg) {
  const v = window.prompt(msg || "访问密钥（API_TOKEN，没设置就留空）", token);
  if (v === null) return;
  token = v.trim();
  localStorage.setItem(TOKEN_KEY, token);
  authPrompted = false;      // 换了密钥，下次 401 可以再问
  blobCache.clear();         // 旧密钥下取失败的缓存作废
  rendered.snaps = null;
  refreshState();
}

/** 带鉴权头取图片，转成 objectURL（<img src> 没法带自定义头）。 */
async function fetchImage(url) {
  const resp = await api(url);
  if (!resp.ok) throw new Error("图片不可用（HTTP " + resp.status + "）");
  return URL.createObjectURL(await resp.blob());
}

// ── 实时拍照 ────────────────────────────────────────────────────────────────

async function setStage(url) {
  // 必须先解码再上屏。之前是 appendChild(新图) + remove(旧图)，新图那时还没
  // 解码完，中间会露出一帧空白——直播 10 fps 下就是每秒闪十次的"频闪"。
  // 设备本地预览没这问题，因为 _cam_show() 是直接往屏上推像素，没有空窗。
  // 同时复用同一个 <img>：反复增删 DOM 节点本身也会让浏览器重排闪一下。
  const stage = $("#stage");
  const next = new Image();
  next.src = url;
  try {
    await next.decode();          // 解码完成前不碰屏幕
  } catch (e) {
    return;                       // 这一帧坏了就跳过，别把好画面换成空白
  }
  let img = stage.querySelector("img");
  if (!img) {
    img = next;
    img.alt = "最新画面";
    img.onclick = () => showLightbox(stageUrl);
    stage.appendChild(img);
  } else {
    img.src = url;                // 已在解码缓存里，赋值即时生效，不会白屏
  }
  stageUrl = url;
  $("#stageMsg").style.display = "none";
}

function pushStrip(url, label) {
  const strip = $("#strip");
  const img = new Image();
  img.src = url;
  img.title = label;
  img.alt = label;
  img.onclick = () => { setStage(url); showLightbox(url); };
  strip.prepend(img);
  // 只留最近 12 张：更早的连同 objectURL 一起释放。
  // 但如果用户点过老图把它放到了大图区，撤掉 URL 会让大图变成裂图——跳过它。
  while (strip.children.length > 12) {
    const gone = strip.lastElementChild;
    if (gone.src !== stageUrl) URL.revokeObjectURL(gone.src);
    gone.remove();
  }
}

async function describeShot(request_id) {
  try {
    await apiJson("/api/monitor/describe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request_id: request_id, device_id: currentDevice() }),
    });
    toast("已交给 AI 识别，说出来大约要 30–60 秒，结果会出现在下面的快照留档", 5000);
    [25, 45, 75].forEach((s) => setTimeout(refreshState, s * 1000));
  } catch (e) { toast("识别请求失败：" + e.message); }
}

async function showShot(request_id, manual, hires) {
  const url = await fetchImage("/photo/" + request_id);
  const label = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  // 直播中不抢大图：下一帧 200ms 后就把它盖掉了，只往缩略图条里放
  if (!streaming) await setStage(url);
  pushStrip(url, label);
  $("#shotStatus").textContent = streaming
    ? (hires ? "已高清拍 " : "已抓拍 ") + label + "（见下方缩略图，点开看大图）"
    : "更新于 " + label;
  // 自动刷新时不识别：每 5 秒说一句会吵死，也白烧 token
  if (manual && $("#chkSpeak").checked) describeShot(request_id);
}

async function captureOnce(manual, hires) {
  if (capturing) return;
  capturing = true;
  $("#btnShot").disabled = true;
  $("#btnHires").disabled = true;
  if (!streaming) $("#stage").classList.add("busy");
  $("#shotStatus").textContent = hires
    ? "高清拍摄中…（直播画面会停几秒）"
    : (streaming ? "抓拍当前画面…" : "下发拍照命令…");
  try {
    const shot = await apiJson("/api/monitor/capture", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device_id: currentDevice(), hires: !!hires }),
    });
    const request_id = shot.request_id;
    // 直播抓拍是服务端现成的帧，直接就绪，不用轮询设备
    if (shot.status === "done") {
      await showShot(request_id, manual, hires);
      return;
    }
    $("#shotStatus").textContent = "等待设备上传…";
    const deadline = Date.now() + 60000;
    while (Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 800));
      const resp = await api("/capture-result/" + request_id);
      if (resp.status === 202) continue;            // 还在拍
      const data = await resp.json();
      if (resp.status === 200 && data.status === "done") {
        await showShot(request_id, manual, hires);
        return;
      }
      throw new Error(data.error || "设备拍照失败");
    }
    throw new Error("等待超时，设备可能离线");
  } catch (e) {
    $("#shotStatus").innerHTML = '<span class="err">' + e.message + "</span>";
  } finally {
    capturing = false;
    $("#btnShot").disabled = false;
    $("#btnHires").disabled = false;
    // 直播刚开、还在等第一帧时，busy 是直播的等待动画，别在这里给撤了
    if (!streaming) $("#stage").classList.remove("busy");
  }
}

function currentDevice() {
  return ($("#devInput").value || "cores3").trim();
}

function setAuto(secs) {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (secs > 0) {
    if (streaming) stopStream();            // 两者都要摄像头，不能同时开
    autoTimer = setInterval(() => captureOnce(false), secs * 1000);
    captureOnce(false);
  }
}

// ── 直播 ────────────────────────────────────────────────────────────────────
//
// 设备端每收到一次 start 就把自己的直播截止时间往后推。网页每 20 秒续一次，
// 所以页面被关掉 / 断网时，设备最多再传 45 秒就自己收摊，不会一直开着摄像头。

async function postStream(action) {
  return apiJson("/api/monitor/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: action, device_id: currentDevice() }),
  });
}

async function startStream() {
  if (streaming) return;
  if (autoTimer) { $("#selAuto").value = "0"; setAuto(0); }
  streaming = true;
  streamSeq = -1;
  $("#btnLive").classList.add("primary");
  $("#btnLive").textContent = "⏹ 停止直播";
  $("#btnShot").textContent = "📷 抓拍这一帧";
  $("#btnHires").hidden = false;      // 高清拍只在直播时有意义（平时拍一张就是高清）
  $("#stage").classList.add("busy");
  $("#shotStatus").textContent = "正在唤醒摄像头…";
  try {
    await postStream("start");
  } catch (e) {
    $("#shotStatus").innerHTML = '<span class="err">' + e.message + "</span>";
    stopStream();
    return;
  }
  streamKeepalive = setInterval(() => postStream("start").catch(() => {}), 20000);
  streamLoop();
}

async function stopStream() {
  if (!streaming) return;
  streaming = false;
  if (streamKeepalive) { clearInterval(streamKeepalive); streamKeepalive = null; }
  $("#btnLive").classList.remove("primary");
  $("#btnLive").textContent = "🔴 直播";
  $("#btnShot").textContent = "📷 拍一张";
  $("#btnHires").hidden = true;
  $("#stage").classList.remove("busy");
  $("#shotStatus").textContent = "直播已停止";
  try { await postStream("stop"); } catch (e) { /* 设备自己也会超时收摊 */ }
}

async function streamLoop() {
  let shown = 0;
  const t0 = Date.now();
  let waited = 0;
  while (streaming) {
    let resp;
    try {
      resp = await api("/stream/" + currentDevice() + "/frame.jpg?after=" + streamSeq);
    } catch (e) {
      $("#shotStatus").innerHTML = '<span class="err">' + e.message + "</span>";
      break;
    }
    if (resp.status === 204) {
      // 设备还没连上来：等够 25 秒仍无帧就别干等了
      waited += 3;
      if (shown === 0 && waited >= 25) {
        // 一帧都没等到 = 设备根本没连上 5002。最常见是端口没转发进来
        // （服务端跑在 WSL 里时尤其容易漏），其次才是摄像头初始化失败。
        $("#shotStatus").innerHTML =
          '<span class="err">设备没连上直播端口 5002：检查端口转发/防火墙，' +
          "再看设备串口日志有没有 cannot connect</span>";
        stopStream();
        return;
      }
      continue;
    }
    if (!resp.ok) break;
    streamSeq = parseInt(resp.headers.get("X-Frame-Seq") || "-1", 10);
    const url = URL.createObjectURL(await resp.blob());
    const prev = streamUrl;
    await setStage(url);                     // 等新帧真正上屏
    streamUrl = url;
    if (prev) URL.revokeObjectURL(prev);     // 换完再撤，避免大图闪一下空白
    shown += 1;
    if (shown === 1) $("#stage").classList.remove("busy");   // 画面来了就撤掉等待动画
    const fps = shown / Math.max((Date.now() - t0) / 1000, 1);
    $("#shotStatus").textContent = "直播中 · " + shown + " 帧 · " + fps.toFixed(1) + " fps";
  }
}

// ── 定时计划 ────────────────────────────────────────────────────────────────

function fmtLast(r) {
  if (!r) return '<span class="dim">还没跑过</span>';
  const when = new Date(r.ts * 1000).toLocaleString("zh-CN", { hour12: false });
  if (r.error && !r.reply) return '<span class="err">' + when + " 失败：" + esc(r.error) + "</span>";
  const spoken = r.spoken ? " 🔊已播报" : " （未播报）";
  return '<span class="ok">' + when + spoken + "</span><br>" + esc(r.reply || "");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderSchedules(list) {
  const sig = JSON.stringify(list);
  if (sig === rendered.sched) return;      // 内容没变就别重绘，免得点按钮时被刷掉
  rendered.sched = sig;
  const box = $("#schedList");
  if (!list.length) {
    box.innerHTML = '<p class="dim small">还没有定时计划。下面加一条，比如每天 08:00 拍一张看看家里怎么样。</p>';
    return;
  }
  box.innerHTML = "";
  for (const s of list) {
    const el = document.createElement("div");
    el.className = "sched" + (s.enabled ? "" : " off");
    el.innerHTML =
      '<div class="row">' +
        '<span class="time">' + esc(s.time) + "</span>" +
        '<span class="pill">' + esc(s.device_id) + "</span>" +
        '<span class="spacer"></span>' +
        // 按钮成组换行，否则窄屏下「删」会被挤到单独一行
        '<span class="row" style="gap:6px">' +
          '<button class="mini" data-act="toggle">' + (s.enabled ? "停用" : "启用") + "</button>" +
          '<button class="mini" data-act="edit">改</button>' +
          '<button class="mini" data-act="run">试跑</button>' +
          '<button class="mini danger" data-act="del">删</button>' +
        "</span>" +
      "</div>" +
      '<p class="prompt">' + esc(s.prompt || "（不限定，让它自己发挥）") + "</p>" +
      '<div class="last">' + fmtLast(s.last_result) + "</div>";
    el.querySelector('[data-act="toggle"]').onclick = () =>
      patchSchedule(s.id, { enabled: !s.enabled });
    el.querySelector('[data-act="edit"]').onclick = () => editSchedule(s);
    el.querySelector('[data-act="run"]').onclick = () => runSchedule(s.id);
    el.querySelector('[data-act="del"]').onclick = () => delSchedule(s);
    box.appendChild(el);
  }
}

async function patchSchedule(id, fields) {
  try {
    await apiJson("/api/monitor/schedules/" + id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    refreshState();
  } catch (e) { toast("修改失败：" + e.message); }
}

function editSchedule(s) {
  const t = window.prompt("触发时间（HH:MM，24 小时制）", s.time);
  if (t === null) return;
  const p = window.prompt("要问它什么（留空则不限定，让它自己看图发挥）", s.prompt || "");
  if (p === null) return;
  patchSchedule(s.id, { time: t.trim(), prompt: p });
}

async function runSchedule(id) {
  try {
    await apiJson("/api/monitor/schedules/" + id + "/run", { method: "POST" });
    toast("已开始试跑：拍照 + 识别大约要 30–60 秒，完成后这里会刷新", 5000);
    // 识别链路较慢，隔一会儿多刷几次拿结果
    [20, 40, 70].forEach((s) => setTimeout(refreshState, s * 1000));
  } catch (e) { toast("试跑失败：" + e.message); }
}

async function delSchedule(s) {
  if (!window.confirm("删除每天 " + s.time + " 的拍照计划？")) return;
  try {
    await apiJson("/api/monitor/schedules/" + s.id, { method: "DELETE" });
    refreshState();
  } catch (e) { toast("删除失败：" + e.message); }
}

async function addSchedule() {
  const time = $("#newTime").value;
  if (!time) { toast("先选个时间"); return; }
  try {
    await apiJson("/api/monitor/schedules", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        time: time,
        device_id: currentDevice(),
        prompt: $("#newPrompt").value,
      }),
    });
    $("#newPrompt").value = "";
    toast("已添加，每天 " + time + " 自动拍一张");
    refreshState();
  } catch (e) { toast("添加失败：" + e.message); }
}

// ── 快照留档 ────────────────────────────────────────────────────────────────

const lazyImages = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    lazyImages.unobserve(en.target);
    loadSnapImage(en.target);
  }
}, { rootMargin: "150px" });

async function loadSnapImage(holder) {
  const name = holder.dataset.name;
  try {
    let url = blobCache.get(name);
    if (!url) {
      url = await fetchImage(holder.dataset.url);
      blobCache.set(name, url);
    }
    const img = new Image();
    img.src = url;
    img.alt = name;
    img.onclick = () => showLightbox(url);
    holder.innerHTML = "";
    holder.appendChild(img);
  } catch (e) {
    holder.textContent = "图片已清理";
  }
}

function renderSnapshots(list) {
  const sig = JSON.stringify(list);
  if (sig === rendered.snaps) return;
  rendered.snaps = sig;

  // 已被服务端清理掉的快照，把它的 objectURL 一起释放
  const alive = new Set(list.map((s) => s.name));
  for (const [name, url] of blobCache) {
    if (!alive.has(name)) { URL.revokeObjectURL(url); blobCache.delete(name); }
  }

  const box = $("#snaps");
  if (!list.length) {
    box.innerHTML = '<p class="dim small">定时任务跑过之后，照片和识别结果会留在这里。</p>';
    return;
  }
  box.innerHTML = "";
  for (const s of list) {
    const when = new Date(s.ts * 1000).toLocaleString("zh-CN", { hour12: false });
    const el = document.createElement("div");
    el.className = "snap";
    el.innerHTML =
      '<div class="thumb" data-name="' + esc(s.name) + '" data-url="' + esc(s.image_url) + '">' +
        (s.has_image ? "载入中…" : "无图片") + "</div>" +
      '<div class="meta"><div class="when">' + esc(when) + "</div>" +
      '<div class="reply">' +
        (s.error ? '<span class="err">' + esc(s.error) + "</span>" : esc(s.reply || "")) +
      "</div></div>";
    box.appendChild(el);
    if (s.has_image) lazyImages.observe(el.querySelector(".thumb"));
  }
}

// ── 总体状态 ────────────────────────────────────────────────────────────────

function renderDevices(devices, mqttOk) {
  const dot = $("#devDot"), text = $("#devText");
  const names = Object.keys(devices);
  if (!names.length) {
    dot.className = "dot";
    text.textContent = "尚无设备心跳";
    return;
  }
  const want = currentDevice();
  const name = names.includes(want) ? want : names[0];
  const d = devices[name];
  dot.className = "dot " + (d.online ? "on" : "off");
  const bits = [name, d.online ? "在线" : "离线 " + Math.round(d.last_seen_secs_ago / 60) + " 分钟"];
  if (d.bat != null) bits.push(d.bat + "%" + (d.chg ? "⚡" : ""));
  if (d.rssi != null) bits.push(d.rssi + "dBm");
  if (!mqttOk) bits.push("⚠️ MQTT 未连接");
  text.textContent = bits.join(" · ");
}

async function refreshState() {
  try {
    const st = await apiJson(
      "/api/monitor/state?device_id=" + encodeURIComponent(currentDevice()));
    $("#clock").textContent = st.server_time;
    renderDevices(st.devices, st.mqtt);
    renderSchedules(st.schedules);
    renderSnapshots(st.snapshots);
  } catch (e) {
    $("#devText").textContent = e.message === "未授权" ? "需要访问密钥" : "服务端不可达";
    $("#devDot").className = "dot off";
  }
}

function showLightbox(url) {
  const lb = $("#lightbox");
  lb.querySelector("img").src = url;
  lb.style.display = "flex";
}

$("#lightbox").onclick = () => { $("#lightbox").style.display = "none"; };
$("#btnShot").onclick = () => captureOnce(true, false);
$("#btnHires").onclick = () => captureOnce(true, true);
$("#btnLive").onclick = () => (streaming ? stopStream() : startStream());
// 页面被切走/关掉就停播，别让设备一直开着摄像头（设备端超时是第二道保险）
document.addEventListener("visibilitychange", () => {
  if (document.hidden && streaming) stopStream();
});
window.addEventListener("pagehide", () => { if (streaming) stopStream(); });
$("#btnAdd").onclick = addSchedule;
$("#btnToken").onclick = () => askToken();
$("#selAuto").onchange = (e) => setAuto(parseInt(e.target.value, 10));
$("#devInput").onchange = refreshState;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("#lightbox").style.display = "none";
});

refreshState();
setInterval(refreshState, 15000);
</script>
</body>
